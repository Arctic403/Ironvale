<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#091017">
  <title>RiftCity Building Diagnostic Inspector</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#091017;color:#eef7fd;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    #shell{position:fixed;inset:0;display:grid;grid-template-columns:minmax(0,1fr) 330px}#stage{position:relative;min-width:0;background:#081018}#plan{display:block;width:100%;height:100%;touch-action:none}
    #coords{position:absolute;left:12px;bottom:12px;padding:7px 9px;border:1px solid #ffffff20;border-radius:9px;background:#071018dc;color:#bfe7ff;font:800 10px/1.35 ui-monospace,SFMono-Regular,Menlo,monospace;pointer-events:none;white-space:pre}
    aside{overflow:auto;border-left:1px solid #ffffff18;background:#0b151df5;padding:14px}h1{margin:0;font-size:17px}small{color:#8ea7b8}.eyebrow{color:#69b7ec;font-size:9px;font-weight:900;letter-spacing:.14em}.card{margin-top:12px;padding:11px;border:1px solid #ffffff16;border-radius:12px;background:#ffffff06}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.row button,.row select{min-height:38px;border:1px solid #ffffff20;border-radius:9px;background:#101f2a;color:#fff;font-weight:800}.row button.active{background:#1b5c84}.stat{display:flex;justify-content:space-between;gap:12px;padding:4px 0;color:#b8cbd7;font-size:11px}.stat b{color:#fff}.diag{padding:8px 0;border-top:1px solid #ffffff10;font-size:10px;line-height:1.35}.diag:first-child{border-top:0}.diag.error{color:#ffb8b8}.diag.warning{color:#ffdba1}.diag.notice{color:#aed9f4}.legend{display:grid;grid-template-columns:auto 1fr;gap:5px 8px;font-size:10px;color:#b8cbd7}.sw{width:10px;height:10px;border-radius:2px;margin-top:2px}
    @media(max-width:760px){#shell{grid-template-columns:1fr}aside{position:absolute;z-index:4;right:8px;top:8px;width:min(310px,calc(100vw - 16px));max-height:48vh;border:1px solid #ffffff1c;border-radius:14px;box-shadow:0 16px 50px #000a;background:#0b151df2}#coords{bottom:8px;left:8px}}
  </style>
</head>
<body>
  <main id="shell">
    <section id="stage"><canvas id="plan"></canvas><pre id="coords">LOCAL —\nWORLD —\nCHUNK —</pre></section>
    <aside>
      <div class="eyebrow">RIFTCITY AI BUILDING PIPELINE</div><h1 id="title">Diagnostic Inspector</h1><small id="status">Loading BuildingProgram…</small>
      <div class="card"><div class="row"><select id="floor"></select><button id="wire">WIREFRAME</button></div><div class="row" style="margin-top:8px"><button id="grid" class="active">1M GRID</button><button id="xray">ALL FLOORS</button></div></div>
      <div class="card" id="stats"></div>
      <div class="card"><div class="eyebrow">SEMANTIC LEGEND</div><div class="legend" style="margin-top:8px"><span class="sw" style="background:#d0d6da"></span><span>wall / shell</span><span class="sw" style="background:#63bce8"></span><span>window</span><span class="sw" style="background:#ba9f74"></span><span>floor / roof</span><span class="sw" style="background:#e7b74d"></span><span>stair connector</span><span class="sw" style="background:#68bb6f"></span><span>room / anchor</span></div></div>
      <div class="card"><div class="eyebrow">VALIDATION / REPAIR</div><div id="diagnostics" style="margin-top:6px"></div></div>
    </aside>
  </main>
  <script type="module" src="./rift-building-inspection.js"></script>
</body>
</html>
