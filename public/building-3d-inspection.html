<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#090d12">
  <title>Ironvale Building 3D Inspection</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#090d12;color:#eef4f8;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    #inspection-shell{position:fixed;inset:0;background:#090d12}
    #inspection-canvas{display:block;width:100%;height:100%;touch-action:none}
    #inspection-hud{position:fixed;left:12px;top:12px;z-index:2;max-width:min(760px,calc(100vw - 24px));padding:10px 12px;border:1px solid rgba(255,255,255,.16);border-radius:10px;background:rgba(4,8,12,.82);backdrop-filter:blur(8px);pointer-events:none}
    #inspection-hud strong{display:block;font-size:12px;letter-spacing:.08em}
    #inspection-hud span{display:block;margin-top:4px;color:#bdc8d1;font-size:11px;line-height:1.4}
    html[data-rift-inspection-ready="1"] #inspection-hud{opacity:.76}
    html[data-rift-inspection-error="1"] #inspection-hud{border-color:#b64c4c;background:rgba(44,8,8,.9)}
  </style>
</head>
<body>
  <main id="inspection-shell" aria-label="Ironvale multi-angle building inspection">
    <canvas id="inspection-canvas"></canvas>
    <div id="inspection-hud"><strong>IRONVALE BUILDING 3D INSPECTION · H1.93</strong><span id="inspection-status">Compiling source BuildingProgram and measuring physical clearance…</span></div>
  </main>
  <script type="module" src="./rift-render-quality.js"></script>
  <script type="module" src="./rift-building-3d-inspection.js"></script>
</body>
</html>
