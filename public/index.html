<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#11110f" />
  <meta name="application-name" content="RiftCity" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="RiftCity" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>RiftCity</title>
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" type="image/svg+xml" href="/riftcity-icon.svg" />
  <link rel="apple-touch-icon" href="/riftcity-icon.svg" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div id="app-shell">
    <header class="topbar">
      <button id="menu-button" class="icon-button" aria-label="Open menu">☰</button>
      <a class="brand" href="#city" data-route="city"><span class="brand-mark">R</span><strong>RiftCity</strong></a>
      <div class="page-title"><span id="page-eyebrow" class="eyebrow">RIFTCITY</span><h1 id="page-title-text">Character</h1></div>
      <div class="top-actions">
        <span id="hud-status" class="hud-status status-active">OFFLINE</span>
        <button id="logout-btn" class="ghost-button">Logout</button>
      </div>
    </header>

    <section id="status" class="session-status">Checking session…</section>

    <section id="hud-shell" class="hud-shell hidden">
      <div id="hud-primary" class="hud-scroll"></div>
      <div id="effects-strip" class="effects-strip empty"></div>
    </section>

    <section id="auth-grid" class="auth-layout">
      <div class="auth-copy">
        <span class="eyebrow">RIFTCITY V2</span>
        <h2>Enter the city.</h2>
        <p>Server-authoritative crime, economy, progression, combat and world systems. Sign in to continue your player.</p>
      </div>
      <div class="auth-forms">
        <form id="login-form" class="rc-panel auth-panel">
          <span class="eyebrow">RETURNING PLAYER</span><h2>Login</h2>
          <label>Username<input name="username" autocomplete="username" required /></label>
          <label>Password<input name="password" type="password" autocomplete="current-password" required /></label>
          <button class="rc-button primary">Enter RiftCity</button>
        </form>
        <form id="register-form" class="rc-panel auth-panel">
          <span class="eyebrow">NEW PLAYER</span><h2>Create account</h2>
          <label>Username<input name="username" autocomplete="username" minlength="3" maxlength="20" required /></label>
          <label>Password<input name="password" type="password" autocomplete="new-password" minlength="8" required /></label>
          <button class="rc-button">Create player</button>
        </form>
      </div>
    </section>

    <main id="game-root" class="game-root hidden" aria-live="polite"></main>

    <aside id="game-drawer" class="game-drawer">
      <button id="drawer-backdrop" class="drawer-backdrop" aria-label="Close menu"></button>
      <div class="drawer-panel">
        <header><div class="brand"><span class="brand-mark">R</span><strong>RiftCity</strong></div><button id="drawer-close" class="icon-button">×</button></header>
        <nav id="drawer-nav"></nav>
        <footer><a href="/admin/logs">Developer logs</a></footer>
      </div>
    </aside>

    <div id="message" class="message hidden" role="status"></div>
    <nav id="mobile-nav" class="mobile-nav hidden" aria-label="Primary navigation"></nav>
  </div>
  <script type="module" src="/app.js"></script>
</body>
</html>
