<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>RiftCity V2 — Phase 1</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <main class="shell">
    <header class="hero">
      <div class="eyebrow">RIFTCITY V2</div>
      <h1>Phase 1 Foundation</h1>
      <p>Account, session, and role system test console.</p>
    </header>

    <section id="status" class="status-card">Checking session…</section>

    <section id="auth-grid" class="grid">
      <form id="register-form" class="card">
        <h2>Create account</h2>
        <label>Username<input name="username" autocomplete="username" minlength="3" maxlength="20" required /></label>
        <label>Password<input name="password" type="password" autocomplete="new-password" minlength="8" required /></label>
        <button>Create player</button>
      </form>

      <form id="login-form" class="card">
        <h2>Login</h2>
        <label>Username<input name="username" autocomplete="username" required /></label>
        <label>Password<input name="password" type="password" autocomplete="current-password" required /></label>
        <button>Enter RiftCity</button>
      </form>
    </section>

    <section id="account-card" class="card hidden">
      <div class="account-head">
        <div>
          <div class="eyebrow">ACTIVE SESSION</div>
          <h2 id="account-name">Player</h2>
        </div>
        <span id="account-role" class="badge">player</span>
      </div>
      <dl id="account-details"></dl>
      <button id="logout-btn" class="secondary">Logout</button>
    </section>

    <div id="message" class="message hidden" role="status"></div>
  </main>
  <script type="module" src="/app.js"></script>
</body>
</html>
