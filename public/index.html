<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#101a16">
  <title>Ironvale</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <section id="auth-screen" class="screen">
    <div class="auth-card">
      <div class="brand">IRONVALE</div>
      <h1>Rift Terrain Core</h1>
      <p>Sign in to enter the new continuous terrain runtime.</p>
      <div class="auth-tabs">
        <button type="button" data-auth-tab="login" class="active">Login</button>
        <button type="button" data-auth-tab="register">Register</button>
      </div>
      <form id="auth-form">
        <input name="username" autocomplete="username" placeholder="Username" maxlength="24" required>
        <input name="password" type="password" autocomplete="current-password" placeholder="Password" maxlength="128" required>
        <button id="auth-submit" type="submit">Enter Ironvale</button>
      </form>
      <div id="auth-status" role="status"></div>
    </div>
  </section>

  <main id="world-screen" class="screen" hidden>
    <canvas id="rift-canvas"></canvas>
    <div class="topbar">
      <div><strong id="character-name">Ironvale</strong><span id="terrain-status">Loading terrain…</span></div>
      <div class="top-actions"><button id="terrain-tools-button" type="button">Terrain</button><button id="logout-button" type="button">Logout</button></div>
    </div>
    <div id="terrain-tools" class="terrain-tools" hidden>
      <strong>Rift Terrain</strong><small>Brush applies at your character position.</small>
      <label>Radius <input id="brush-radius" type="range" min="2" max="30" step="1" value="10"></label>
      <label>Strength <input id="brush-strength" type="range" min="0.1" max="3" step="0.1" value="0.8"></label>
      <div class="brush-grid"><button data-brush="raise">Raise</button><button data-brush="lower">Lower</button><button data-brush="smooth">Smooth</button><button data-brush="flatten">Flatten</button></div>
      <button id="reset-terrain" class="wide">Reset generated terrain</button>
    </div>
    <div id="coords" class="coords">160, 10, 160</div>
    <div id="joystick" class="joystick" aria-label="Movement control"><div id="joystick-knob"></div></div>
    <div class="look-hint">Drag to look</div>
  </main>
  <script type="module" src="/app.js"></script>
</body>
</html>
