<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b0e12">
  <title>Ironvale World Inspection</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0b0e12;color:#e8edf2;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    #inspection-shell{position:fixed;inset:0;background:#0b0e12}
    #inspection-canvas{display:block;width:100%;height:100%;touch-action:none}
    #inspection-hud{position:fixed;left:12px;top:12px;z-index:2;max-width:min(560px,calc(100vw - 24px));padding:9px 11px;border:1px solid rgba(255,255,255,.14);border-radius:10px;background:rgba(5,8,12,.78);backdrop-filter:blur(8px);pointer-events:none}
    #inspection-hud strong{display:block;font-size:12px;letter-spacing:.08em}
    #inspection-hud span{display:block;margin-top:4px;color:#b8c2cc;font-size:11px;line-height:1.35}
    html[data-rift-inspection-ready="1"] #inspection-hud{opacity:.72}
    html[data-rift-inspection-error="1"] #inspection-hud{border-color:#a44747;background:rgba(43,10,10,.88)}
  </style>
</head>
<body>
  <main id="inspection-shell" aria-label="Ironvale static world inspection">
    <canvas id="inspection-canvas"></canvas>
    <div id="inspection-hud"><strong>IRONVALE WORLD INSPECTION</strong><span id="inspection-status">Loading source-controlled JSON…</span></div>
  </main>
  <script type="module" src="./rift-wasm-core.js"></script>
  <script type="module" src="./rift-render-quality.js"></script>
  <script type="module" src="./rift-ai-world-tools.js"></script>
  <script type="module" src="./rift-world-composition-runtime.js"></script>
  <script type="module" src="./rift-world-inspection.js"></script>
</body>
</html>
