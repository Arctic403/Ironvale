<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Ironvale — System Logs</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <main class="shell logs-shell">
    <header class="hero logs-head">
      <div>
        <div class="eyebrow">IRONVALE DEV</div>
        <h1>System Logs</h1>
        <p>Temporary public development log viewer for debugging.</p>
      </div>
      <a class="link-button" href="/">Back</a>
    </header>

    <section class="card log-toolbar">
      <select id="severity-filter" aria-label="Severity">
        <option value="">All levels</option>
        <option value="ERROR">Errors</option>
        <option value="WARNING">Warnings</option>
        <option value="INFO">Info</option>
      </select>
      <select id="resolved-filter" aria-label="Resolution status">
        <option value="">All status</option>
        <option value="0">Unresolved</option>
        <option value="1">Resolved</option>
      </select>
      <button id="refresh-logs">Refresh</button>
    </section>

    <section id="log-status" class="status-card">Loading logs…</section>
    <section id="logs-list" class="logs-list"></section>
  </main>
  <script type="module" src="/admin-logs.js"></script>
</body>
</html>
