name: Apply Security Smoke v1

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply-security-smoke-v1.mjs'
      - '.github/workflows/apply-security-smoke-v1.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply Security Smoke v1
        run: node scripts/apply-security-smoke-v1.mjs

      - name: Verify
        run: npm run build

      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/realtime-entry.js public/rift-auto-validation.js public/rift-validator-guard.js public/app.js public/index.html public/ironvale-integrity-manifest.json src/integrity-build.js scripts/check-integrity-chain.mjs package.json
          git diff --cached --quiet && exit 0
          git commit -m 'Add anti-cheat security smoke to validator and L3'
          git push origin HEAD:main
