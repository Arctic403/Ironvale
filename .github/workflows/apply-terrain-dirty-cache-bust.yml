name: Apply Terrain Dirty Cache Refresh

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply-terrain-dirty-cache-bust.mjs'
      - '.github/workflows/apply-terrain-dirty-cache-bust.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply cache refresh
        run: node scripts/apply-terrain-dirty-cache-bust.mjs
      - name: Verify
        run: |
          node --check public/app.js
          node --check public/rift-landscape.js
          node scripts/check-terrain-dirty-region.mjs
          npm run build
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/app.js public/index.html public/rift-landscape.js
          git commit -m "Refresh terrain dirty-region runtime cache"
          git pull --rebase origin main
          git push origin HEAD:main
