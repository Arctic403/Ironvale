name: Probe Live Anti-Cheat API

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-live-anticheat.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe deployed Worker
        shell: bash
        run: |
          set -euo pipefail
          base='https://riftcityv1.kc-campbell132.workers.dev'
          probe() {
            name="$1"
            path="$2"
            body="$(mktemp)"
            status="$(curl -sS --connect-timeout 10 --max-time 20 -o "$body" -w '%{http_code}' "$base$path")"
            echo "$name status=$status"
            head -c 500 "$body" || true
            echo
          }
          probe health '/api/health'
          probe anticheat '/api/anticheat/summary'
