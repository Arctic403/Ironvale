name: Apply Integrity Ticket Redaction

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply-integrity-ticket-redaction.mjs'
      - '.github/workflows/apply-integrity-ticket-redaction.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply redaction
        run: |
          node scripts/apply-integrity-ticket-redaction.mjs
          node scripts/generate-integrity-manifest.mjs
      - name: Verify
        run: |
          node --check public/rift-diagnostics.js
          node --check public/rift-diagnostic-hooks.js
          node scripts/generate-integrity-manifest.mjs --check
          npm run build
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/rift-diagnostics.js public/rift-diagnostic-hooks.js public/ironvale-integrity-manifest.json src/integrity-build.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Redact integrity tickets from diagnostics'
          git pull --rebase origin main
          git push origin HEAD:main
