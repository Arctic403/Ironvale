name: Rift Native Core v4 Conversion

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply-rift-native-v4.mjs'
      - '.github/workflows/rift-native-v4-conversion.yml'

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout Ironvale
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply guarded v4 source conversion
        run: node scripts/apply-rift-native-v4.mjs

      - name: Compile Native Core v4
        run: |
          mkdir -p public/wasm src/wasm
          clang++ \
            --target=wasm32 \
            -O3 \
            -nostdlib \
            -fno-builtin \
            -fno-exceptions \
            -fno-rtti \
            -Wl,--no-entry \
            -Wl,--strip-all \
            -Wl,--export=rift_core_version \
            -Wl,--export=rift_section_index \
            -Wl,--export=rift_floor_div \
            -Wl,--export=rift_positive_mod \
            -Wl,--export=rift_aabb_intersects \
            -Wl,--export=rift_distance_sq3 \
            -Wl,--export=rift_hash3 \
            -Wl,--export=rift_crossed_support \
            -Wl,--export=rift_ground_step_classify \
            -Wl,--export=rift_stair_top \
            -Wl,--export=rift_shape_top \
            -Wl,--export=rift_state_shape_top \
            -Wl,--export=rift_section_slot_capacity \
            -Wl,--export=rift_section_slot_states_ptr \
            -Wl,--export=rift_section_slot_bind \
            -Wl,--export=rift_section_slot_invalidate \
            -Wl,--export=rift_section_slot_get_state \
            -Wl,--export=rift_get_block_world \
            -Wl,--export=rift_section_states_ptr \
            -Wl,--export=rift_section_face_masks_ptr \
            -Wl,--export=rift_build_section_face_masks \
            -Wl,--export=rift_section_borders_ptr \
            -Wl,--export=rift_material_colors_ptr \
            -Wl,--export=rift_mesh_vertices_ptr \
            -Wl,--export=rift_mesh_indices_ptr \
            -Wl,--export=rift_mesh_face_count \
            -Wl,--export=rift_mesh_block_count \
            -Wl,--export=rift_mesh_vertex_count \
            -Wl,--export=rift_mesh_index_count \
            -Wl,--export=rift_build_section_mesh \
            -Wl,--export=rift_batch_capacity \
            -Wl,--export=rift_batch_query_xyz_ptr \
            -Wl,--export=rift_batch_query_states_ptr \
            -Wl,--export=rift_batch_query_world \
            -Wl,--export=rift_raycast_hit_ptr \
            -Wl,--export=rift_raycast_distance \
            -Wl,--export=rift_raycast_world \
            -Wl,--export=rift_mesh_partial_block_count \
            -Wl,--export=rift_mesh_occupied_microvoxels \
            -Wl,--export=rift_mesh_visible_microfaces \
            -Wl,--export=rift_mesh_culled_microfaces \
            -Wl,--export=rift_set_block_world \
            -Wl,--export=rift_batch_mutate_world \
            -Wl,--export=rift_player_result_ptr \
            -Wl,--export=rift_player_flags_ptr \
            -Wl,--export=rift_player_step_world \
            -Wl,--export=rift_spatial_capacity \
            -Wl,--export=rift_spatial_entities_ptr \
            -Wl,--export=rift_spatial_meta_ptr \
            -Wl,--export=rift_spatial_results_ptr \
            -Wl,--export=rift_spatial_query_sphere \
            -Wl,--export=rift_agent_capacity \
            -Wl,--export=rift_agent_data_ptr \
            -Wl,--export=rift_simulate_agents \
            -Wl,--export=rift_path_point_capacity \
            -Wl,--export=rift_path_points_ptr \
            -Wl,--export=rift_pathfind_world \
            -Wl,--export=rift_combat_result_ptr \
            -Wl,--export=rift_combat_resolve \
            -Wl,--export=rift_metric_mesh_builds \
            -Wl,--export=rift_metric_faces_emitted \
            -Wl,--export=rift_metric_batch_calls \
            -Wl,--export=rift_metric_batch_cells \
            -Wl,--export=rift_metric_raycasts \
            -Wl,--export=rift_metric_raycast_steps \
            -Wl,--export=rift_metric_player_steps \
            -Wl,--export=rift_metric_collision_probes \
            -Wl,--export=rift_metric_mutations \
            -Wl,--export=rift_metric_pathfinds \
            -Wl,--export=rift_metric_path_nodes \
            -Wl,--export=rift_metric_spatial_queries \
            -Wl,--export=rift_metric_agent_steps \
            -Wl,--export=rift_metric_combat_resolves \
            -Wl,--export=rift_metric_reset \
            native/rift-core.cpp \
            -o public/wasm/rift-core.wasm
          cp public/wasm/rift-core.wasm src/wasm/rift-core.wasm

      - name: Verify generated v4 ABI
        run: node scripts/check-rift-wasm-core.js

      - name: Run full Ironvale and Rift Engine regression suite
        run: npm run build

      - name: Install Worker dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Verify Cloudflare Worker and WASM bundle
        run: npx wrangler deploy --dry-run --outdir=/tmp/ironvale-native-v4-worker

      - name: Verify production diff
        run: |
          git diff --check
          git status --short
          test -s public/wasm/rift-core.wasm
          test -s src/wasm/rift-core.wasm

      - name: Commit verified Native Core v4
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            native/rift-core.cpp \
            public/rift-wasm-core.js \
            public/rift-player.js \
            public/rift-block-section.js \
            public/wasm/rift-core.wasm \
            src/rift-wasm-core.js \
            src/wasm/rift-core.wasm \
            scripts/check-rift-wasm-core.js \
            scripts/check-rift-native-integration.js \
            scripts/check-rift-native-v4.js \
            package.json \
            .github/workflows/rift-wasm-core.yml \
            .github/workflows/rift-world-preview.yml
          git commit -m 'Upgrade Rift Native Core to v4 gameplay kernel'
          git push origin HEAD:main
