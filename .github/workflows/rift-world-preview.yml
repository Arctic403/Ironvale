name: Rift World Preview

on:
  push:
    branches: [main, ai-static-world-builder]
    paths:
      - 'package.json'
      - 'native/**/*.cpp'
      - 'src/**/*.js'
      - 'src/wasm/**/*.wasm'
      - 'public/wasm/**/*.wasm'
      - 'public/rift-wasm-core.js'
      - 'public/rift-block-section.js'
      - 'public/riftcity-blocks/**/*.json'
      - 'public/riftcity-buildings/**/*.json'
      - 'public/inspection.html'
      - 'public/index.html'
      - 'public/rift-world-inspection.js'
      - 'public/rift-world-composer.js'
      - 'public/rift-world-composition-runtime.js'
      - 'public/rift-building-program.js'
      - 'public/rift-interior-architecture.js'
      - 'public/rift-engine.js'
      - 'public/rift-engine-geometry.js'
      - 'public/rift-engine-math.js'
      - 'public/rift-render-quality.js'
      - 'public/rift-texture-atlas.js'
      - 'public/rift-material-library.js'
      - 'public/rift-city-block-importer.js'
      - 'public/rift-city-blueprints.js'
      - 'public/rift-building-visibility.js'
      - 'public/rift-player.js'
      - 'public/rift-smart-camera.js'
      - 'public/rift-third-person-camera.js'
      - 'scripts/**/*.js'
      - '.github/workflows/rift-world-preview.yml'
  pull_request:
    branches: [main]
    paths:
      - 'package.json'
      - 'native/**/*.cpp'
      - 'src/**/*.js'
      - 'src/wasm/**/*.wasm'
      - 'public/wasm/**/*.wasm'
      - 'public/rift-wasm-core.js'
      - 'public/rift-block-section.js'
      - 'public/riftcity-blocks/**/*.json'
      - 'public/riftcity-buildings/**/*.json'
      - 'public/inspection.html'
      - 'public/index.html'
      - 'public/rift-world-inspection.js'
      - 'public/rift-world-composer.js'
      - 'public/rift-world-composition-runtime.js'
      - 'public/rift-building-program.js'
      - 'public/rift-interior-architecture.js'
      - 'public/rift-engine.js'
      - 'public/rift-engine-geometry.js'
      - 'public/rift-engine-math.js'
      - 'public/rift-render-quality.js'
      - 'public/rift-texture-atlas.js'
      - 'public/rift-material-library.js'
      - 'public/rift-city-block-importer.js'
      - 'public/rift-city-blueprints.js'
      - 'public/rift-building-visibility.js'
      - 'public/rift-player.js'
      - 'public/rift-smart-camera.js'
      - 'public/rift-third-person-camera.js'
      - 'scripts/**/*.js'
      - '.github/workflows/rift-world-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout RiftCity
        uses: actions/checkout@v4

      - name: Mirror Cloudflare build verification
        run: npm run build

      - name: Install Worker bundle dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Verify Wrangler Worker + WASM bundle
        run: npx wrangler deploy --dry-run --outdir=/tmp/rift-worker-dry

      - name: Smoke-test Cloudflare Worker + WASM runtime
        run: |
          npx wrangler dev --local --port 8792 > /tmp/rift-worker-runtime.log 2>&1 &
          WORKER_PID=$!
          trap 'kill $WORKER_PID 2>/dev/null || true' EXIT
          for i in {1..40}; do
            if curl -fsS http://127.0.0.1:8792/api/health > /tmp/rift-worker-health.json; then
              cat /tmp/rift-worker-health.json
              exit 0
            fi
            sleep 0.5
          done
          cat /tmp/rift-worker-runtime.log
          exit 1

      - name: Start static RiftCity server
        run: |
          python3 -m http.server 4173 --directory public > /tmp/riftcity-static.log 2>&1 &
          echo $! > /tmp/riftcity-static.pid
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:4173/inspection.html >/dev/null; then exit 0; fi
            sleep 0.25
          done
          cat /tmp/riftcity-static.log
          exit 1

      - name: Render top and birdseye previews
        run: |
          mkdir -p rift-world-previews
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME" ]; then
            echo 'No Chrome/Chromium binary found on the GitHub runner.' >&2
            exit 1
          fi
          FLAGS=(
            --headless=new
            --no-sandbox
            --disable-dev-shm-usage
            --hide-scrollbars
            --ignore-gpu-blocklist
            --enable-webgl
            --use-angle=swiftshader
            --window-size=1600,1200
            --virtual-time-budget=5000
          )
          "$CHROME" "${FLAGS[@]}" --dump-dom 'http://127.0.0.1:4173/inspection.html?view=top' > /tmp/rift-native-browser-dom.html
          grep -q 'data-rift-native-core="wasm"' /tmp/rift-native-browser-dom.html
          grep -q 'data-rift-native-core-version="2"' /tmp/rift-native-browser-dom.html
          "$CHROME" "${FLAGS[@]}" --screenshot=rift-world-previews/downtown-top.png 'http://127.0.0.1:4173/inspection.html?view=top'
          "$CHROME" "${FLAGS[@]}" --screenshot=rift-world-previews/downtown-birdseye.png 'http://127.0.0.1:4173/inspection.html?view=birdseye'
          test -s rift-world-previews/downtown-top.png
          test -s rift-world-previews/downtown-birdseye.png

      - name: Upload Rift world previews
        uses: actions/upload-artifact@v4
        with:
          name: rift-world-previews
          path: rift-world-previews/*.png
          if-no-files-found: error
          retention-days: 14
