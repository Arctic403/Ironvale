name: Retry Terrain Material Pack v1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/retry-terrain-pack-v1.yml'

permissions:
  contents: write

concurrency:
  group: ironvale-terrain-pack-v1
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply measured terrain pack optimization
        run: node scripts/apply-terrain-pack-v1.mjs
      - name: Refresh profiler verifier contract
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/check-terrain-edit-profiler.mjs')
          text = path.read_text()
          old = "assert(terrain.includes('buildTelemetry: { nativeBuildMs, copyMs'),'native build/copy telemetry missing');"
          new = "assert(terrain.includes('_buildSurfaceSectionNative(sectionX') && terrain.includes('nativeBuildMs') && terrain.includes('copyMs'),'native build/copy telemetry missing');"
          if old not in text:
              raise SystemExit('old terrain profiler telemetry assertion not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Remove staging machinery
        run: |
          rm scripts/apply-terrain-pack-v1.mjs
          rm .github/workflows/apply-terrain-pack-v1.yml
          rm .github/workflows/retry-terrain-pack-v1.yml
      - name: Verify full core
        run: npm run build
      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Optimize terrain material mesh packing"
          git push origin HEAD:main
