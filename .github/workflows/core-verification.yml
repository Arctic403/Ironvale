name: Ironvale Core Verification

# npm run build includes the permanent exact local terrain-draft restoration verifier.
on:
  push:
    branches: [main]
    paths:
      - 'public/**'
      - 'src/**'
      - 'scripts/**'
      - 'native/**'
      - 'package.json'
      - 'schema.sql'
      - '.github/workflows/core-verification.yml'
      - '.github/workflows/ai-anticheat-review.yml'
  pull_request:
    paths:
      - 'public/**'
      - 'src/**'
      - 'scripts/**'
      - 'native/**'
      - 'package.json'
      - 'schema.sql'
      - '.github/workflows/core-verification.yml'
      - '.github/workflows/ai-anticheat-review.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ironvale-core-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify engine and diagnostics
        run: npm run build
