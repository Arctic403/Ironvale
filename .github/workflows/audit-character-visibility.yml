name: Fix Character Visibility

on:
  push:
    branches: [character-visibility-audit]
    paths:
      - '.github/workflows/audit-character-visibility.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: character-visibility-audit
          fetch-depth: 0

      - name: Apply character loader fix
        run: python3 .rift-fixes/fix_character_sparse_accessors.py

      - name: Verify exact animation library needs sparse/zero accessor support
        shell: bash
        run: |
          python3 <<'PY'
          import json, struct
          from pathlib import Path
          p=Path('public/assets/characters/quaternius/universal-animation-library.glb')
          data=p.read_bytes(); assert data[:4]==b'glTF'
          ln,typ=struct.unpack_from('<II',data,12); assert typ==0x4E4F534A
          doc=json.loads(data[20:20+ln].decode('utf-8').rstrip('\x00 '))
          missing=[i for i,a in enumerate(doc.get('accessors',[])) if 'bufferView' not in a]
          sparse=[i for i,a in enumerate(doc.get('accessors',[])) if a.get('sparse')]
          print('animation accessors without bufferView:',len(missing),missing[:20])
          print('animation sparse accessors:',len(sparse),sparse[:20])
          assert missing, 'Expected the imported animation library to exercise zero-base accessors'
          PY
          grep -F "if (accessor.sparse)" public/rift-character.js
          grep -F "accessor.bufferView != null" public/rift-character.js
          grep -F "rift-character.js?v=20260831-character-sparse-r1" public/app.js
          grep -F "/app.js?v=20260831-character-sparse-r1" public/index.html

      - name: Build Ironvale
        run: npm run build

      - name: Commit verified character fix
        shell: bash
        run: |
          rm -f .github/workflows/audit-character-visibility.yml .rift-fixes/fix_character_sparse_accessors.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Fix glTF animation accessors for player character"
          git push origin HEAD:character-visibility-audit
