name: Move Ironvale Asset Library Remote

on:
  push:
    paths:
      - '.github/workflows/move-assets-remote.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Ironvale
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify remote RiftAssets catalog
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 4 --retry-delay 2 \
            'https://raw.githubusercontent.com/Arctic403/RiftAssets/0a6ae2b559962bf61f1b8e252f5bd4cfbad8e3c9/ironvale/registry.json' \
            -o /tmp/ironvale-remote-registry.json
          curl -fL --retry 4 --retry-delay 2 \
            'https://raw.githubusercontent.com/Arctic403/RiftAssets/0a6ae2b559962bf61f1b8e252f5bd4cfbad8e3c9/ironvale/asset-lock.json' \
            -o /tmp/ironvale-remote-lock.json
          python3 <<'PY'
          import json
          from pathlib import Path
          registry=json.loads(Path('/tmp/ironvale-remote-registry.json').read_text())
          lock=json.loads(Path('/tmp/ironvale-remote-lock.json').read_text())
          assert registry['format']=='ironvale-remote-asset-registry-v1'
          counts={p['id']:p['modelCount'] for p in registry['packs']}
          expected={
            'quaternius-medieval-village':176,
            'quaternius-stylized-nature':68,
            'quaternius-fantasy-props-safe':70,
            'kaykit-dungeon-environment':150,
            'quaternius-fantasy-outfits':24,
            'quaternius-animated-animals':12,
          }
          for key,value in expected.items():
              assert counts.get(key)==value,(key,counts.get(key),value)
          assert len(registry.get('assets',[]))==500
          assert len(lock.get('files',[]))==996
          print('Remote catalog verified: 500 models / 996 locked files')
          PY

      - name: Replace vendored payload with remote pointer
        shell: bash
        run: |
          set -euo pipefail
          rm -rf vendor/assets
          rm -f .github/workflows/lock-medieval-content.yml
          mkdir -p public/assets
          cat > public/assets/remote-library.json <<'JSON'
          {
            "format": "ironvale-asset-library-pointer-v1",
            "repository": "Arctic403/RiftAssets",
            "branch": "main",
            "pinnedCommit": "0a6ae2b559962bf61f1b8e252f5bd4cfbad8e3c9",
            "registry": "https://raw.githubusercontent.com/Arctic403/RiftAssets/main/ironvale/registry.json",
            "pinnedRegistry": "https://raw.githubusercontent.com/Arctic403/RiftAssets/0a6ae2b559962bf61f1b8e252f5bd4cfbad8e3c9/ironvale/registry.json",
            "lock": "https://raw.githubusercontent.com/Arctic403/RiftAssets/0a6ae2b559962bf61f1b8e252f5bd4cfbad8e3c9/ironvale/asset-lock.json",
            "libraryBase": "https://raw.githubusercontent.com/Arctic403/RiftAssets/main/ironvale/library",
            "pagesBase": "https://arctic403.github.io/RiftAssets/ironvale/library",
            "delivery": "on-demand",
            "cachePolicy": "cache only assets actually selected or used",
            "shippingPolicy": "promote only world-used optimized assets into Ironvale public assets",
            "sourceLibraryBytes": 418381824,
            "registeredModels": 500,
            "lockedFiles": 996
          }
          JSON

      - name: Verify lean Ironvale tree and build
        shell: bash
        run: |
          set -euo pipefail
          test ! -e vendor/assets
          test ! -e .github/workflows/lock-medieval-content.yml
          test -f public/assets/remote-library.json
          test -f public/assets/characters/quaternius/universal-base-male.glb
          test -f public/assets/characters/quaternius/universal-animation-library.glb
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('public/assets/remote-library.json').read_text())
          assert p['delivery']=='on-demand'
          assert p['registeredModels']==500
          assert p['pinnedCommit']=='0a6ae2b559962bf61f1b8e252f5bd4cfbad8e3c9'
          PY
          npm run build
          echo 'Current working tree size after remote migration:'
          du -sh --exclude=.git .

      - name: Commit lean remote-library architecture
        shell: bash
        run: |
          set -euo pipefail
          # This migration workflow is one-shot; remove it from the resulting tree too.
          rm -f .github/workflows/move-assets-remote.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git status --short
          if git diff --cached --quiet; then
            echo 'No migration changes to commit.'
            exit 0
          fi
          git commit -m 'Move medieval asset library to RiftAssets'
          git push origin HEAD:main
