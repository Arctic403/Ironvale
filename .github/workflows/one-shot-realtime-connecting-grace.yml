name: Ironvale One-shot Realtime Connecting Grace

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-realtime-connecting-grace.yml'
      - 'scripts/apply-realtime-connecting-grace.mjs'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply bounded realtime connecting grace
        run: node scripts/apply-realtime-connecting-grace.mjs
      - name: Verify syntax
        run: |
          node --check public/rift-realtime.js
          node --check public/rift-validator-guard.js
          node --check scripts/check-realtime-state.mjs
      - name: Verify realtime contract
        run: node scripts/check-realtime-state.mjs
      - name: Commit runtime patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/rift-realtime.js public/rift-validator-guard.js public/index.html scripts/check-realtime-state.mjs
          if git diff --cached --quiet; then
            echo "No runtime patch required."
            exit 0
          fi
          git commit -m "Ignore brief realtime connecting transitions"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
