name: Diagnostics V1

on:
  push:
    branches: [diagnostics-v1]

permissions:
  contents: write

jobs:
  diagnostics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: diagnostics-v1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply diagnostics patch
        run: node scripts/apply-diagnostics-patch.mjs
      - name: Verify diagnostics contract
        run: |
          node --check public/rift-diagnostics.js
          node - <<'NODE'
          const fs = require('fs');
          const d = fs.readFileSync('public/rift-diagnostics.js','utf8');
          const app = fs.readFileSync('public/app.js','utf8');
          const world = JSON.parse(fs.readFileSync('public/world/ironvale-terrain.json','utf8'));
          const html = fs.readFileSync('public/index.html','utf8');
          for (const token of ['l1Quick','l2Runtime','l3Deep','automatic-crash','credentialsIncluded: false','captureCrash']) if (!d.includes(token)) throw new Error('diagnostics missing '+token);
          for (const token of ['buildDiagnosticSnapshot','buildDiagnosticChecks','window.IronvaleDiagnostics',"captureCrash(error, 'world-boot')"]) if (!app.includes(token)) throw new Error('app missing '+token);
          if (world.diagnostics?.layers?.length !== 3 || world.diagnostics?.automaticCrashDumpLevel !== 2) throw new Error('world diagnostics contract');
          for (const level of ['1','2','3']) if (!html.includes('data-diagnostic-dump="'+level+'"')) throw new Error('missing dump button '+level);
          console.log('Three-layer diagnostics contract verified.');
          NODE
      - name: Verify full Ironvale build
        run: npm run build
      - name: Commit verified diagnostics system
        run: |
          rm -f scripts/apply-diagnostics-patch.mjs .github/workflows/diagnostics-v1.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add automated validator and three-layer diagnostic dumps'
          git push origin HEAD:diagnostics-v1
