name: Rift Portrait Fullscreen Fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rift-portrait-viewport-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout RiftCity
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply portrait fullscreen viewport patch
        run: node scripts/apply-rift-portrait-viewport-fix.mjs

      - name: Verify patch diff and JavaScript
        run: |
          git diff --check
          node --check public/downtown3d-foundation.js

      - name: Run full RiftCity regression suite
        run: npm run build

      - name: Install Worker dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Verify Cloudflare Worker bundle
        run: npx wrangler deploy --dry-run --outdir=/tmp/rift-portrait-worker

      - name: Commit verified viewport fix to main
        run: |
          if git diff --quiet -- public/downtown3d-foundation.js public/styles.css; then
            echo 'Portrait fullscreen viewport fix is already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/downtown3d-foundation.js public/styles.css
          git commit -m 'Fix iPhone portrait fullscreen viewport alignment'
          git push origin HEAD:main
