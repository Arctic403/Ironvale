name: Install Rigged Humanoid Player

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/install-rigged-character.yml'

permissions:
  contents: write

jobs:
  install-character:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Attach rigged humanoid visual to Rift controller
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          path = Path('public/app.js')
          text = path.read_text()

          old = "import { RiftEngine } from './rift-engine.js';\nimport { RiftTerrain } from './rift-terrain.js';"
          new = "import { RiftEngine } from './rift-engine.js';\nimport { RiftTerrain } from './rift-terrain.js';\nimport { loadRiggedCharacterGeometry } from './rift-character.js';"
          if old not in text:
              raise SystemExit('app imports changed; refusing blind patch')
          text = text.replace(old, new, 1)

          old = "const THIRD_PERSON_FOCUS_HEIGHT = 1.20;"
          new = "const THIRD_PERSON_FOCUS_HEIGHT = 1.20;\nconst PLAYER_COLLIDER_HALF_HEIGHT = .9;"
          if old not in text:
              raise SystemExit('camera constants changed; refusing blind patch')
          text = text.replace(old, new, 1)

          old = "let playerMesh = null;"
          new = "let playerMesh = null;\nlet playerVisualFeetAnchored = false;\nlet playerRig = null;"
          if old not in text:
              raise SystemExit('player mesh state changed; refusing blind patch')
          text = text.replace(old, new, 1)

          old = "  playerMesh = engine.addMesh(createCapsuleGeometry(), { position: [player.x, player.y, player.z] });\n  snapPlayerToSupport();"
          new = "  playerVisualFeetAnchored = false;\n  playerRig = null;\n  playerMesh = engine.addMesh(createCapsuleGeometry(), { position: [player.x, player.y, player.z] });\n  snapPlayerToSupport();\n  void installRiggedPlayerVisual();"
          if old not in text:
              raise SystemExit('player visual bootstrap changed; refusing blind patch')
          text = text.replace(old, new, 1)

          old = "  playerMesh = null;\n  brushMesh = null;"
          new = "  playerMesh = null;\n  playerVisualFeetAnchored = false;\n  playerRig = null;\n  brushMesh = null;"
          if old not in text:
              raise SystemExit('stopWorld player cleanup changed; refusing blind patch')
          text = text.replace(old, new, 1)

          old = "  if (playerMesh) playerMesh.position = [player.x, player.y, player.z];\n}\n\nfunction frame(now) {"
          new = "  updatePlayerVisualTransform();\n}\n\nfunction updatePlayerVisualTransform() {\n  if (!playerMesh) return;\n  playerMesh.position[0] = player.x;\n  playerMesh.position[1] = playerVisualFeetAnchored ? player.y - PLAYER_COLLIDER_HALF_HEIGHT : player.y;\n  playerMesh.position[2] = player.z;\n  playerMesh.yaw = player.yaw;\n}\n\nasync function installRiggedPlayerVisual() {\n  if (!engine || !playerMesh) return;\n  const activeEngine = engine;\n  const fallbackMesh = playerMesh;\n  try {\n    const asset = await loadRiggedCharacterGeometry('/assets/characters/quaternius/universal-base-male.glb');\n    if (!engine || engine !== activeEngine || playerMesh !== fallbackMesh) return;\n    const human = engine.addMesh(asset.geometry, {\n      position: [player.x, player.y - PLAYER_COLLIDER_HALF_HEIGHT, player.z],\n      yaw: player.yaw\n    });\n    human.rig = asset.rig;\n    human.characterAsset = 'quaternius-universal-base-male';\n    engine.removeMesh(fallbackMesh);\n    playerMesh = human;\n    playerVisualFeetAnchored = true;\n    playerRig = asset.rig;\n    updatePlayerVisualTransform();\n    const jointText = Number(asset.rig?.jointCount) || 0;\n    terrainStatus.textContent = `${terrainStatus.textContent} · humanoid ${jointText}-joint rig`;\n    console.info('Rift character visual loaded', asset.rig);\n  } catch (error) {\n    console.warn('Rigged humanoid failed to load; keeping capsule fallback.', error);\n  }\n}\n\nfunction frame(now) {"
          if old not in text:
              raise SystemExit('snapPlayerToSupport tail changed; refusing blind patch')
          text = text.replace(old, new, 1)

          old = "  if (playerMesh) {\n    playerMesh.position[0] = player.x;\n    playerMesh.position[1] = player.y;\n    playerMesh.position[2] = player.z;\n    playerMesh.yaw = player.yaw;\n  }"
          new = "  updatePlayerVisualTransform();"
          if old not in text:
              raise SystemExit('player transform block changed; refusing blind patch')
          text = text.replace(old, new, 1)

          path.write_text(text)
          PY

      - name: Compact the imported character audit
        shell: bash
        run: |
          cat > public/assets/characters/quaternius/character-audit.json <<'EOF'
          {
            "format": "ironvale-character-audit-v1",
            "license": "CC0-1.0",
            "author": "Quaternius",
            "character": {
              "file": "universal-base-male.glb",
              "sha256": "a466828c67a4acc9b2413212ce6d9cde235e3aed9b675680c14fd9673858f118",
              "bytes": 6465208,
              "triangles": 14318,
              "materials": 3,
              "textures": 7,
              "heightMeters": 1.8196,
              "skin": "Armature",
              "jointCount": 65,
              "feetAtY": -0.0095,
              "authoredForward": "+Z"
            },
            "animationLibrary": {
              "file": "universal-animation-library.glb",
              "sha256": "4c748767741a3e495d89667b9a218b690ba9810b9517a12e960780e3ca72c4e9",
              "bytes": 2714756,
              "clips": 43,
              "sharedJointCount": 65,
              "status": "imported for locomotion integration"
            }
          }
          EOF

      - name: Harden core checks for character visual contract
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          path = Path('scripts/check-core.js')
          text = path.read_text()
          marker = "const nativeRequired = ['native/include/rift/terrain.hpp','native/src/terrain.cpp','public/rift-core.js','public/rift-core.wasm.gz'];\nfor (const path of nativeRequired) if (!fs.existsSync(path)) failures.push(`missing ${path}`);"
          replacement = marker + "\n\nconst characterRequired = ['public/rift-character.js','public/assets/characters/quaternius/universal-base-male.glb','public/assets/characters/quaternius/universal-animation-library.glb','public/assets/characters/quaternius/LICENSE-BASE-CHARACTERS.txt','public/assets/characters/quaternius/LICENSE-ANIMATIONS.txt'];\nfor (const path of characterRequired) if (!fs.existsSync(path)) failures.push(`missing ${path}`);\nif (fs.existsSync('public/assets/characters/quaternius/universal-base-male.glb') && fs.statSync('public/assets/characters/quaternius/universal-base-male.glb').size !== 6465208) failures.push('rigged character asset size');\nif (fs.existsSync('public/assets/characters/quaternius/universal-animation-library.glb') && fs.statSync('public/assets/characters/quaternius/universal-animation-library.glb').size !== 2714756) failures.push('character animation asset size');\nif (fs.existsSync('public/assets/characters/quaternius/LICENSE-BASE-CHARACTERS.txt') && !fs.readFileSync('public/assets/characters/quaternius/LICENSE-BASE-CHARACTERS.txt','utf8').includes('CC0 1.0')) failures.push('character CC0 license');"
          if marker not in text:
              raise SystemExit('native checker marker changed; refusing blind patch')
          text = text.replace(marker, replacement, 1)

          marker2 = "if (!app.includes('function applyCameraLookDelta(') || !app.includes('function cameraForward(') || !app.includes('function cameraAnglesFromDirection(')) failures.push('shared camera math');"
          replacement2 = marker2 + "\nif (!app.includes(\"import { loadRiggedCharacterGeometry } from './rift-character.js'\") || !app.includes('function installRiggedPlayerVisual(') || !app.includes('function updatePlayerVisualTransform(')) failures.push('rigged humanoid controller hookup');\nif (!app.includes('createCapsuleGeometry()')) failures.push('character visual fallback');"
          if marker2 not in text:
              raise SystemExit('camera checker marker changed; refusing blind patch')
          text = text.replace(marker2, replacement2, 1)
          path.write_text(text)
          PY

      - name: Verify Ironvale with humanoid player
        run: npm run build

      - name: Commit verified player visual
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/install-rigged-character.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Attach CC0 rigged humanoid to player controller"
          git push origin HEAD:main
