name: Rift Cloudflare Efficiency Patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rift-cloudflare-efficiency.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout RiftCity
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply efficiency patch
        run: |
          node scripts/apply-rift-cloudflare-efficiency-part1.mjs
          node scripts/apply-rift-cloudflare-efficiency-part2.mjs
          node scripts/apply-rift-cloudflare-efficiency-part3.mjs

      - name: Verify patch diff and JavaScript
        run: |
          git diff --check
          node --check public/ui/api.js
          node --check public/ui/shell.js
          node --check public/app.js
          node --check public/rift-game-menu.js
          node --check src/index.js
          node --check src/services/sync.js
          node --check src/services/gameplay.js
          node --check src/services/advanced.js
          node --check src/services/living-city.js
          node --check scripts/check-rift-cloudflare-efficiency.js

      - name: Run full RiftCity regression suite
        run: npm run build

      - name: Install Worker dependencies
        run: npm install --ignore-scripts

      - name: Verify Cloudflare Worker bundle
        run: npx wrangler deploy --dry-run

      - name: Commit verified efficiency layer to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/ui/api.js public/ui/shell.js public/app.js public/rift-game-menu.js \
            src/index.js src/services/sync.js src/services/gameplay.js src/services/advanced.js \
            src/services/living-city.js schema.sql package.json scripts/check-rift-cloudflare-efficiency.js
          if git diff --cached --quiet; then
            echo "No efficiency changes to commit."
            exit 0
          fi
          git commit -m "Add Cloudflare-efficient sync layer"
          git push origin HEAD:main
