name: One-shot camera math fix

on:
  push:
    branches: [main]
    paths:
      - '.rift-patches/camera-math-fix.patch'

permissions:
  contents: write

concurrency:
  group: ironvale-camera-math-main
  cancel-in-progress: false

jobs:
  apply-camera-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply camera math patch
        run: |
          git apply --check .rift-patches/camera-math-fix.patch
          git apply .rift-patches/camera-math-fix.patch
          rm -f .rift-patches/camera-math-fix.patch
          rmdir .rift-patches 2>/dev/null || true
          rm -f .github/workflows/camera-math-fix.yml

      - name: Verify Ironvale build
        run: npm run build

      - name: Commit verified camera fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix camera math across orbit and freecam"
          git push origin HEAD:main
