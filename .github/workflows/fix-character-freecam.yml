name: Fix Character Freecam Runtime

on:
  workflow_dispatch:
  push:
    branches: [fix-character-freecam]
    paths:
      - .github/workflows/fix-character-freecam.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-character-freecam
          fetch-depth: 0

      - name: Apply patch
        run: python3 .rift-fixes/fix_character_freecam.py

      - name: Verify build
        run: npm run build

      - name: Commit fix
        run: |
          rm -f .github/workflows/fix-character-freecam.yml .rift-fixes/fix_character_freecam.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Fix character loading and freecam runtime state"
          git push origin HEAD:fix-character-freecam
