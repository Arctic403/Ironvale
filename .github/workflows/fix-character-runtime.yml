name: Wire Animated Textured Character

on:
  push:
    paths:
      - '.github/workflows/fix-character-runtime.yml'

permissions:
  contents: write

jobs:
  character-runtime:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Ironvale
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Wire character runtime into gameplay
        shell: bash
        run: |
          set -euo pipefail
          echo '' | base64 -d > /tmp/patch-character-runtime.py
          python3 /tmp/patch-character-runtime.py

      - name: Verify character and engine build
        shell: bash
        run: |
          set -euo pipefail
          node --check public/rift-character.js
          node --check public/rift-engine.js
          node --check public/app.js
          npm run build

      - name: Commit animated textured character
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/app.js public/rift-character.js public/rift-engine.js public/assets/characters/quaternius/character-audit.json scripts/check-core.js package.json
          if git diff --cached --quiet; then
            echo 'No character runtime changes to commit.'
            exit 0
          fi
          git commit -m 'Animate and texture the player character'
          git push origin HEAD:main
