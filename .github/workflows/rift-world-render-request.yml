name: Rift World Render Request

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  render:
    if: >-
      startsWith(github.event.issue.title, '[RIFT-RENDER]') &&
      (github.event.issue.author_association == 'OWNER' ||
       github.event.issue.author_association == 'MEMBER' ||
       github.event.issue.author_association == 'COLLABORATOR')
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout AI world branch
        uses: actions/checkout@v4
        with:
          ref: ai-static-world-builder

      - name: Validate world JSON
        run: |
          node scripts/check-rift-world-index.js
          node scripts/check-rift-city-blueprints.js
          node --check public/rift-world-inspection.js

      - name: Start static RiftCity server
        run: |
          python3 -m http.server 4173 --directory public > /tmp/riftcity-static.log 2>&1 &
          echo $! > /tmp/riftcity-static.pid
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:4173/inspection.html >/dev/null; then exit 0; fi
            sleep 0.25
          done
          cat /tmp/riftcity-static.log
          exit 1

      - name: Render top and birdseye previews
        run: |
          mkdir -p rift-world-previews
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME" ]; then
            echo 'No Chrome/Chromium binary found on the GitHub runner.' >&2
            exit 1
          fi
          FLAGS=(
            --headless=new
            --no-sandbox
            --disable-dev-shm-usage
            --hide-scrollbars
            --ignore-gpu-blocklist
            --enable-webgl
            --use-angle=swiftshader
            --window-size=1600,1200
            --virtual-time-budget=5000
          )
          "$CHROME" "${FLAGS[@]}" --screenshot=rift-world-previews/downtown-top.png 'http://127.0.0.1:4173/inspection.html?view=top'
          "$CHROME" "${FLAGS[@]}" --screenshot=rift-world-previews/downtown-birdseye.png 'http://127.0.0.1:4173/inspection.html?view=birdseye'
          test -s rift-world-previews/downtown-top.png
          test -s rift-world-previews/downtown-birdseye.png

      - name: Upload Rift world previews
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: rift-world-previews-${{ github.event.issue.number }}
          path: rift-world-previews/*.png
          if-no-files-found: error
          retention-days: 14

      - name: Comment render result
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          gh issue comment "$ISSUE" --repo "$REPO" --body "## Rift world render ✅\nRendered the source-controlled JSON from \`ai-static-world-builder\` with the real Rift Engine.\n\n- top-down PNG\n- 3/4 bird's-eye PNG\n- workflow run: \`$RUN_ID\`\n- artifact: \`rift-world-previews-$ISSUE\`\n\nNo Cloudflare, Worker, D1, or R2 was used."
