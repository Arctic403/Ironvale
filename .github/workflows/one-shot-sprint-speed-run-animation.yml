name: Ironvale One-shot Sprint Speed Run Animation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-sprint-speed-run-animation.yml'
      - 'scripts/apply-sprint-speed-run-animation.mjs'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Normalize current validator patch target
        run: sed -i "s/Capsule fallback active/Fallback character visual active/g" scripts/apply-sprint-speed-run-animation.mjs
      - name: Apply sprint speed and run animation patch
        run: node scripts/apply-sprint-speed-run-animation.mjs
      - name: Align verifier cache expectation
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/check-realtime-state.mjs')
          source = path.read_text()
          old = "requireMatch(html, /rift-validator-guard\\.js\\?v=20260901-reconnect-grace-r1/, 'validator reconnect-grace module loaded');"
          new = "requireMatch(html, /rift-validator-guard\\.js\\?v=20260901-sprint-speed-r2/, 'validator sprint-speed module loaded');"
          if old not in source:
              raise SystemExit('old validator cache verifier target missing')
          path.write_text(source.replace(old, new, 1))
          PY
      - name: Verify changed JavaScript syntax
        run: |
          node --check public/app.js
          node --check public/rift-character.js
          node --check public/rift-auto-validation.js
          node --check public/rift-validator-guard.js
          node --check src/realtime-entry.js
          node --check scripts/check-realtime-state.mjs
      - name: Verify realtime and sprint contract
        run: node scripts/check-realtime-state.mjs
      - name: Run full build verification
        run: npm run build
      - name: Commit runtime patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/app.js public/rift-character.js public/rift-auto-validation.js public/rift-validator-guard.js public/index.html public/assets/characters/quaternius/character-audit.json src/realtime-entry.js scripts/check-realtime-state.mjs
          git commit -m 'Make sprint measurably faster with real run animation'
          git pull --rebase origin main
          git push origin HEAD:main
