name: Verify Character Runtime Assets

on:
  push:
    paths:
      - '.github/workflows/character-runtime-smoke.yml'

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect rig textures and animation compatibility
        shell: bash
        run: |
          set -euo pipefail
          echo '' | base64 -d > /tmp/character-smoke.py
          python3 /tmp/character-smoke.py
          npm run build
