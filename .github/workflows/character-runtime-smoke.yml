name: Finalize Character Locomotion Defaults

on:
  push:
    paths:
      - '.github/workflows/character-runtime-smoke.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Pin normal locomotion clips
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          path = Path('public/rift-character.js')
          text = path.read_text()
          old_idle = "const idle = chooseClip(clipNames, [/^idle$/i, /idle/i, /stand/i], clipNames[0] || null);"
          old_walk = "const walk = chooseClip(clipNames, [/walk(?!.*back)/i, /walking/i, /run/i], idle);"
          new_idle = "const idle = chooseClip(clipNames, [/^idle_loop$/i, /^idle$/i, /^idle_/i, /stand/i], clipNames[0] || null);"
          new_walk = "const walk = chooseClip(clipNames, [/^walk_loop$/i, /^walk$/i, /^walk_/i, /walking/i, /run/i], idle);"
          if old_idle not in text or old_walk not in text:
              raise SystemExit('Expected locomotion selector source was not found.')
          text = text.replace(old_idle, new_idle, 1).replace(old_walk, new_walk, 1)
          path.write_text(text)
          PY
          node --check public/rift-character.js
          grep -F "^idle_loop$" public/rift-character.js >/dev/null
          grep -F "^walk_loop$" public/rift-character.js >/dev/null
          npm run build
      - name: Commit normal locomotion defaults
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/rift-character.js
          if git diff --cached --quiet; then
            echo 'No locomotion default changes to commit.'
            exit 0
          fi
          git commit -m 'Use normal idle and walk character animations'
          git push origin HEAD:main
