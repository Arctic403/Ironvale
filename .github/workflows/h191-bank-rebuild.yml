name: H1.91 Bank Rebuild

on:
  push:
    branches: [ai-static-world-builder]
    paths: ['.github/workflows/h191-bank-rebuild.yml']

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ai-static-world-builder
          fetch-depth: 0
      - name: Apply H1.91
        shell: bash
        run: |
          printf '%s' '' | base64 -d | gzip -d > /tmp/apply.py
          python /tmp/apply.py
          printf '%s' '' | base64 -d | gzip -d | python -m json.tool > public/riftcity-buildings/riftcity-bank-001.json
          printf '%s' '' | base64 -d | gzip -d > scripts/check-rift-downtown-composition.js
          printf '%s' '' | base64 -d | gzip -d > scripts/check-rift-interior-architecture.js
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-audit --no-fund
      - name: Verify full RiftCity build
        run: npm run build
      - name: Commit to AI branch only
        shell: bash
        run: |
          git config user.name 'RiftCity AI Builder'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/h191-bank-rebuild.yml
          git add public/rift-city-block-importer.js public/rift-interior-architecture.js public/rift-world-composer.js public/riftcity-buildings/riftcity-bank-001.json scripts/check-rift-downtown-composition.js scripts/check-rift-interior-architecture.js
          git diff --cached --check
          git commit -m 'H1.91 rebuild Bank with tall vault interiors'
          git push origin HEAD:ai-static-world-builder
