name: Diagnostics Blackbox Final

on:
  push:
    branches: [diagnostics-blackbox-final]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: diagnostics-blackbox-final
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply final black-box gaps
        run: node scripts/apply-blackbox-final.mjs
      - name: Syntax checks
        run: |
          node --check public/rift-diagnostics.js
          node --check public/rift-engine.js
          node --check public/rift-terrain.js
          node --check public/app.js
          node --check scripts/check-core.js
      - name: Verify full Ironvale build
        run: npm run build
      - name: Commit verified final black-box telemetry
        run: |
          rm -f scripts/apply-blackbox-final.mjs
          rm -f .github/workflows/diagnostics-blackbox-final.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Complete max engine black-box diagnostics"
          git push origin HEAD:diagnostics-blackbox-final
