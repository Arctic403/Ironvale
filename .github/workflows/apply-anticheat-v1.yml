name: Apply Anti-Cheat v1

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply-anticheat-v1.mjs'
      - '.github/workflows/apply-anticheat-v1.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply Anti-Cheat v1
        run: node scripts/apply-anticheat-v1.mjs

      - name: Verify source syntax and contracts
        run: npm run build

      - name: Commit Anti-Cheat v1
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/realtime-entry.js schema.sql package.json
          git diff --cached --quiet && exit 0
          git commit -m 'Add server-side bot monitoring and anti-cheat cases'
          git push origin HEAD:main
