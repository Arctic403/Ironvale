name: Rift Native v3 Atomic Integration

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rift-native-v3-integration.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout RiftCity
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and apply Native Core v3 patch
        run: |
          cat .github/native-v3/payload-* > /tmp/rift-native-v3.patch.b64
          base64 -d /tmp/rift-native-v3.patch.b64 | gzip -d > /tmp/rift-native-v3.patch
          git apply --check \
            --exclude='.github/workflows/rift-wasm-core.yml' \
            --exclude='.github/workflows/rift-world-preview.yml' \
            /tmp/rift-native-v3.patch
          git apply \
            --exclude='.github/workflows/rift-wasm-core.yml' \
            --exclude='.github/workflows/rift-world-preview.yml' \
            /tmp/rift-native-v3.patch
          git diff --check

      - name: Compile shared C++ core v3
        run: |
          mkdir -p public/wasm src/wasm
          clang++ \
            --target=wasm32 \
            -O3 \
            -nostdlib \
            -fno-builtin \
            -fno-exceptions \
            -fno-rtti \
            -Wl,--no-entry \
            -Wl,--strip-all \
            -Wl,--export=rift_core_version \
            -Wl,--export=rift_section_index \
            -Wl,--export=rift_floor_div \
            -Wl,--export=rift_positive_mod \
            -Wl,--export=rift_aabb_intersects \
            -Wl,--export=rift_distance_sq3 \
            -Wl,--export=rift_hash3 \
            -Wl,--export=rift_crossed_support \
            -Wl,--export=rift_ground_step_classify \
            -Wl,--export=rift_stair_top \
            -Wl,--export=rift_shape_top \
            -Wl,--export=rift_state_shape_top \
            -Wl,--export=rift_section_slot_capacity \
            -Wl,--export=rift_section_slot_states_ptr \
            -Wl,--export=rift_section_slot_bind \
            -Wl,--export=rift_section_slot_invalidate \
            -Wl,--export=rift_section_slot_get_state \
            -Wl,--export=rift_get_block_world \
            -Wl,--export=rift_section_states_ptr \
            -Wl,--export=rift_section_face_masks_ptr \
            -Wl,--export=rift_build_section_face_masks \
            -Wl,--export=rift_section_borders_ptr \
            -Wl,--export=rift_material_colors_ptr \
            -Wl,--export=rift_mesh_vertices_ptr \
            -Wl,--export=rift_mesh_indices_ptr \
            -Wl,--export=rift_mesh_face_count \
            -Wl,--export=rift_mesh_block_count \
            -Wl,--export=rift_mesh_vertex_count \
            -Wl,--export=rift_mesh_index_count \
            -Wl,--export=rift_build_section_mesh \
            -Wl,--export=rift_batch_capacity \
            -Wl,--export=rift_batch_query_xyz_ptr \
            -Wl,--export=rift_batch_query_states_ptr \
            -Wl,--export=rift_batch_query_world \
            -Wl,--export=rift_raycast_hit_ptr \
            -Wl,--export=rift_raycast_distance \
            -Wl,--export=rift_raycast_world \
            -Wl,--export=rift_metric_mesh_builds \
            -Wl,--export=rift_metric_faces_emitted \
            -Wl,--export=rift_metric_batch_calls \
            -Wl,--export=rift_metric_batch_cells \
            -Wl,--export=rift_metric_raycasts \
            -Wl,--export=rift_metric_raycast_steps \
            -Wl,--export=rift_metric_reset \
            native/rift-core.cpp \
            -o public/wasm/rift-core.wasm
          cp public/wasm/rift-core.wasm src/wasm/rift-core.wasm
          cmp public/wasm/rift-core.wasm src/wasm/rift-core.wasm

      - name: Install Cloudflare Worker dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Run full RiftCity build and native regressions
        run: npm run build

      - name: Verify Wrangler bundles Worker + WASM v3
        run: npx wrangler deploy --dry-run --outdir=/tmp/rift-native-v3-worker

      - name: Smoke-test Cloudflare Worker + WASM v3 runtime
        run: |
          npx wrangler dev --local --port 8793 > /tmp/rift-native-v3-worker.log 2>&1 &
          WORKER_PID=$!
          trap 'kill $WORKER_PID 2>/dev/null || true' EXIT
          for i in {1..40}; do
            if curl -fsS http://127.0.0.1:8793/api/health > /tmp/rift-native-v3-health.json; then
              cat /tmp/rift-native-v3-health.json
              exit 0
            fi
            sleep 0.5
          done
          cat /tmp/rift-native-v3-worker.log
          exit 1

      - name: Verify browser WASM v3 + WebGL render
        run: |
          python3 -m http.server 4174 --directory public > /tmp/rift-native-v3-static.log 2>&1 &
          STATIC_PID=$!
          trap 'kill $STATIC_PID 2>/dev/null || true' EXIT
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:4174/inspection.html >/dev/null; then break; fi
            sleep 0.25
          done
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME"
          FLAGS=(--headless=new --no-sandbox --disable-dev-shm-usage --hide-scrollbars --ignore-gpu-blocklist --enable-webgl --use-angle=swiftshader --window-size=1600,1200 --virtual-time-budget=5000)
          "$CHROME" "${FLAGS[@]}" --dump-dom 'http://127.0.0.1:4174/inspection.html?view=top' > /tmp/rift-native-v3-dom.html
          grep -q 'data-rift-native-core="wasm"' /tmp/rift-native-v3-dom.html
          grep -q 'data-rift-native-core-version="3"' /tmp/rift-native-v3-dom.html
          "$CHROME" "${FLAGS[@]}" --screenshot=/tmp/rift-native-v3.png 'http://127.0.0.1:4174/inspection.html?view=birdseye'
          test -s /tmp/rift-native-v3.png

      - name: Atomically commit tested v3 production files
        run: |
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" || { echo 'main moved during v3 verification; refusing to overwrite it.' >&2; exit 1; }
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            native/rift-core.cpp \
            public/rift-block-section.js \
            public/rift-creative-mode.js \
            public/rift-player.js \
            public/rift-wasm-core.js \
            public/wasm/rift-core.wasm \
            scripts/check-rift-native-integration.js \
            scripts/check-rift-wasm-core.js \
            src/rift-wasm-core.js \
            src/wasm/rift-core.wasm
          git commit -m 'Native Core v3: resident sections, native meshes and DDA'
          git push origin HEAD:main
