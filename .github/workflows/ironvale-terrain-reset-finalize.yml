name: Ironvale Terrain Reset Finalize

on:
  push:
    branches:
      - ironvale-terrain-reset-staging
    paths:
      - .github/workflows/ironvale-terrain-reset-finalize.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ironvale-terrain-reset-finalize
  cancel-in-progress: false

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout staging
        uses: actions/checkout@v4
        with:
          ref: ironvale-terrain-reset-staging
          fetch-depth: 0

      - name: Apply verified terrain reset
        run: |
          node scripts/terrain-reset-cleanup.mjs
          node scripts/terrain-reset-fix-verifiers.mjs

      - name: Verify reset
        run: |
          node scripts/check-ironvale-foundation.js
          node scripts/check-ironvale-starter-game.js

      - name: Commit generated reset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          if git diff --cached --quiet; then
            echo "No generated reset changes to commit."
            exit 0
          fi
          git commit -m "Reset Ironvale terrain to native bootstrap"
          git push origin HEAD:ironvale-terrain-reset-staging
