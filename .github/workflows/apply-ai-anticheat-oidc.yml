name: Apply AI Anti-Cheat OIDC Bridge

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply-ai-anticheat-oidc.mjs'
      - '.github/workflows/apply-ai-anticheat-oidc.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply AI anti-cheat OIDC bridge
        run: node scripts/apply-ai-anticheat-oidc.mjs

      - name: Verify
        run: npm run build

      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/realtime-entry.js package.json
          git diff --cached --quiet && exit 0
          git commit -m 'Connect AI anti-cheat through GitHub OIDC'
          git push origin HEAD:main
