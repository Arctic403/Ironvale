name: Brackenford Region v2 Build

on:
  push:
    branches: [main]
    paths:
      - 'scripts/build-brackenford-region-v2.mjs'
      - 'scripts/fix-brackenford-v2-prefab-bounds.mjs'
      - '.github/workflows/brackenford-region-v2-build.yml'

permissions:
  contents: write

jobs:
  build-region:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Ironvale
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Correct tall prefab bounds
        run: node scripts/fix-brackenford-v2-prefab-bounds.mjs
      - name: Build Brackenford v2
        run: node scripts/build-brackenford-region-v2.mjs
      - name: Verify generated world syntax and compile
        run: |
          node --check scripts/build-brackenford-region-v2.mjs
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { compileRiftCityBlock } from './public/rift-city-block-importer.js';
          const world=JSON.parse(fs.readFileSync('public/rift-world-blocks/brackenford-lowlands-001.json','utf8'));
          const compiled=compileRiftCityBlock(world);
          if(world.version!==2) throw new Error('Brackenford must be v2 blueprint world');
          if(world.bounds.max[0] < 159 || world.bounds.max[2] < 159) throw new Error('Region did not expand');
          if(!world.prefabs?.farmhouse || !world.prefabs?.barn || !world.prefabs?.chapel || !world.prefabs?.reeveHall) throw new Error('Required medieval prefabs missing');
          if((world.layout||[]).length < 30) throw new Error('World is not sufficiently composed');
          if(!JSON.stringify(world).includes('Blackstone cave tunnel')) throw new Error('Cave missing');
          if(!JSON.stringify(world).includes('West barley')) throw new Error('Farm fields missing');
          const serialized=JSON.stringify(world);
          if(!serialized.includes('clear interior') || !serialized.includes('tall interior')) throw new Error('Tall interior grammar missing');
          console.log('[brackenford-v2] compile stats', compiled.stats);
          NODE
      - name: Full Ironvale build verification
        run: npm run build
      - name: Install Worker dependencies
        run: npm install --no-save --no-package-lock wrangler@4.54.0
      - name: Verify Worker and WASM bundle
        run: npx wrangler deploy --dry-run --outdir .wrangler-dryrun
      - name: Guard generated diff
        run: |
          git status --short
          git diff --check
          git diff --name-only | grep -qx 'scripts/build-brackenford-region-v2.mjs'
          git diff --name-only | grep -qx 'public/rift-world-blocks/brackenford-lowlands-001.json'
          git diff --name-only | grep -qx 'src/ironvale/content.js'
          test "$(git diff --name-only | wc -l)" -eq 3
      - name: Commit verified Brackenford region
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/build-brackenford-region-v2.mjs public/rift-world-blocks/brackenford-lowlands-001.json src/ironvale/content.js
          git commit -m 'Rebuild Brackenford as living medieval starter region'
          git push origin HEAD:main
