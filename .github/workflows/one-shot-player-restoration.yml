name: Ironvale One-shot Player Restoration

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-player-restoration.yml'
      - 'scripts/apply-player-restoration-cleanup.mjs'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply exact player restoration cleanup
        run: node scripts/apply-player-restoration-cleanup.mjs
      - name: Commit source cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/app.js public/rift-auto-validation.js public/index.html
          if git diff --cached --quiet; then
            echo "No source cleanup required."
            exit 0
          fi
          git commit -m "Restore validator player transform exactly"
          git push origin HEAD:main
