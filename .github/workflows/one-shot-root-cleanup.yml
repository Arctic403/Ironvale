name: Ironvale One-shot Root Cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-root-cleanup.yml'
      - 'scripts/apply-root-cleanup.mjs'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply root cleanup
        run: node scripts/apply-root-cleanup.mjs
      - name: Commit source cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/app.js
          if git diff --cached --quiet; then
            echo "No source cleanup required."
            exit 0
          fi
          git commit -m "Fix capsule source and expose editor history API"
          git push origin HEAD:main
