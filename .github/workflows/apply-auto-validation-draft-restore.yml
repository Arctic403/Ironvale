name: Apply Auto Validation Draft Restore

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply-auto-validation-draft-restore.mjs'
      - '.github/workflows/apply-auto-validation-draft-restore.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply patch and remove staging
        run: |
          node scripts/apply-auto-validation-draft-restore.mjs
          rm scripts/apply-auto-validation-draft-restore.mjs
          rm .github/workflows/apply-auto-validation-draft-restore.yml

      - name: Verify
        run: npm run build

      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'Restore exact terrain draft after auto validation'
          git push origin HEAD:main
