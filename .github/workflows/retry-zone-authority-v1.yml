name: Retry Zone Authority v1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/retry-zone-authority-v1.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply zone authority
        run: node scripts/apply-zone-authority-v1.mjs

      - name: Refresh legacy cache-tag verifiers
        run: |
          python3 - <<'PY'
          from pathlib import Path
          replacements = {
              r'rift-realtime\.js\?v=20260902-integrity-v1': r'rift-realtime\.js\?v=(?:20260902-integrity-v1|20260902-zone-authority-r1)',
              r'rift-validator-guard\.js\?v=(?:20260902-integrity-v1|20260902-security-smoke-r1)': r'rift-validator-guard\.js\?v=(?:20260902-integrity-v1|20260902-security-smoke-r1|20260902-zone-authority-r1)',
              r'rift-auto-validation\.js\?v=20260902-draft-restore-r1': r'rift-auto-validation\.js\?v=(?:20260902-draft-restore-r1|20260902-zone-authority-r1)',
          }
          for path in Path('scripts').glob('*.mjs'):
              text = path.read_text()
              for old, new in replacements.items():
                  text = text.replace(old, new)
              path.write_text(text)
          PY

      - name: Remove staging machinery
        run: |
          rm scripts/apply-zone-authority-v1.mjs
          rm .github/workflows/apply-zone-authority-v1.yml
          rm .github/workflows/retry-zone-authority-v1.yml

      - name: Verify full core
        run: npm run build

      - name: Verify Wrangler Durable Object config
        run: npx wrangler deploy --dry-run --outdir /tmp/ironvale-zone-dry-run

      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'Add scalable world zone RAM authority'
          git push origin HEAD:main
