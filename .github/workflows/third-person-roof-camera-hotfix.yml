name: Third Person Roof Camera Hotfix

on:
  push:
    branches: [main]
    paths:
      - 'scripts/patch-third-person-roof-camera.mjs'
      - '.github/workflows/third-person-roof-camera-hotfix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply roof camera fix
        run: node scripts/patch-third-person-roof-camera.mjs
      - name: Verify camera and full build
        run: |
          node --check public/rift-third-person-camera.js
          npm run verify:third-person-camera
          npm run build
          git diff --check
      - name: Commit verified fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/rift-third-person-camera.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Fix third-person camera collision under roofs'
          git push origin HEAD:main
