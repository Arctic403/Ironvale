name: Login Boot Hotfix

on:
  push:
    branches: [login-boot-hotfix]

permissions:
  contents: write

jobs:
  hotfix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch stale engine cache and surface boot errors
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          app = Path('public/app.js')
          text = app.read_text()
          old = "import { RiftEngine } from './rift-engine.js?v=20260831-character-freecam-r2';"
          new = "import { RiftEngine } from './rift-engine.js?v=20260901-terrain-lock-r2';"
          if old not in text:
              raise SystemExit('Expected stale RiftEngine import was not found')
          text = text.replace(old, new, 1)
          old_catch = """  } catch (error) {\n    console.error(error);\n    showAuth();\n  }\n}\n"""
          new_catch = """  } catch (error) {\n    console.error('Ironvale world boot failed.', error);\n    showAuth();\n    setAuthStatus(`World boot failed: ${String(error?.message || error || 'unknown error').slice(0, 180)}`, true);\n  }\n}\n"""
          if old_catch not in text:
              raise SystemExit('Expected bootSession catch was not found')
          app.write_text(text.replace(old_catch, new_catch, 1))

          index = Path('public/index.html')
          html = index.read_text()
          old_script = '<script type="module" src="/app.js?v=20260901-terrain-lock-r1"></script>'
          new_script = '<script type="module" src="/app.js?v=20260901-terrain-lock-r2"></script>'
          if old_script not in html:
              raise SystemExit('Expected terrain-lock-r1 app cache key was not found')
          index.write_text(html.replace(old_script, new_script, 1))
          PY

      - name: Verify Ironvale build
        run: npm run build

      - name: Commit verified hotfix
        shell: bash
        run: |
          rm -f .github/workflows/login-boot-hotfix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix terrain boot cache after login"
          git push origin HEAD:login-boot-hotfix
