name: Landscape RPG Controls

on:
  push:
    branches: [landscape-rpg-controls]
    paths:
      - '.github/workflows/landscape-rpg-controls.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: landscape-rpg-controls
          fetch-depth: 0

      - name: Apply landscape RPG controls patch
        run: python3 .rift-fixes/landscape_rpg_controls.py

      - name: Verify gameplay contracts
        shell: bash
        run: |
          set -euo pipefail
          grep -F "const MOBILE_LANDSCAPE_DISTANCE = 6.2" public/app.js
          grep -F "function selectCombatTargetAtScreen" public/app.js
          grep -F "function performBasicAttack" public/app.js
          grep -F "reticle.hidden = !freecamEnabled" public/app.js
          grep -F 'id="combat-hud"' public/index.html
          grep -F 'id="rotate-device"' public/index.html
          grep -F '@media (orientation:portrait) and (pointer:coarse)' public/styles.css
          npm run build

      - name: Commit verified patch
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/landscape-rpg-controls.yml .rift-fixes/landscape_rpg_controls.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add landscape RPG targeting controls and camera profile'
          git push origin HEAD:landscape-rpg-controls
