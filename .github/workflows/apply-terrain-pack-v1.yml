name: Apply Terrain Material Pack v1

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply-terrain-pack-v1.mjs'
      - '.github/workflows/apply-terrain-pack-v1.yml'

permissions:
  contents: write

concurrency:
  group: ironvale-terrain-pack-v1
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply measured terrain pack optimization
        run: node scripts/apply-terrain-pack-v1.mjs
      - name: Remove staging machinery
        run: |
          rm scripts/apply-terrain-pack-v1.mjs
          rm .github/workflows/apply-terrain-pack-v1.yml
      - name: Verify full core
        run: npm run build
      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Optimize terrain material mesh packing"
          git push origin HEAD:main
