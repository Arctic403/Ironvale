name: Valeborn Starter Island Build

on:
  push:
    branches: [main]
    paths:
      - 'scripts/build-brackenford-region-v2.mjs'
      - 'scripts/check-ironvale-starter-game.js'
      - '.github/workflows/valeborn-starter-island-build.yml'

permissions:
  contents: write

jobs:
  build-island:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Ironvale
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Generate Valeborn starter island
        run: node scripts/build-brackenford-region-v2.mjs
      - name: Verify island compile and shape
        run: |
          node --check scripts/build-brackenford-region-v2.mjs
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { compileRiftCityBlock } from './public/rift-city-block-importer.js';
          const world=JSON.parse(fs.readFileSync('public/rift-world-blocks/brackenford-lowlands-001.json','utf8'));
          const compiled=compileRiftCityBlock(world);
          if(world.bounds.max[0] < 319 || world.bounds.max[2] < 319) throw new Error('island did not expand to full starter-zone scale');
          if(world.metadata?.island!==true || world.metadata?.surrounded_by_water!==true) throw new Error('island/ocean metadata missing');
          if(world.metadata?.coastline!=='organic-multilobed') throw new Error('organic coastline metadata missing');
          if(world.metadata?.buildings!==false || Object.keys(world.prefabs||{}).length || (world.layout||[]).length) throw new Error('terrain-only pass contains buildings');
          const text=JSON.stringify(world);
          for(const required of ['Valeborn surrounding sea','western_bay','southeast_peninsula','Blackstone cave chamber','Brackenford River']) if(!text.includes(required)) throw new Error('missing '+required);
          if(world.ops.length>=20000) throw new Error('island authoring exceeds engine op budget');
          console.log('[valeborn-island] compile stats',compiled.stats,'ops',world.ops.length);
          NODE
      - name: Full Ironvale build verification
        run: npm run build
      - name: Install Worker dependencies
        run: npm install --no-save --no-package-lock wrangler@4.54.0
      - name: Verify Worker and WASM bundle
        run: npx wrangler deploy --dry-run --outdir .wrangler-dryrun
      - name: Guard generated diff
        run: |
          git status --short
          git diff --check
          git diff --exit-code -- scripts/build-brackenford-region-v2.mjs scripts/check-ironvale-starter-game.js
          git diff --name-only | grep -qx 'public/rift-world-blocks/brackenford-lowlands-001.json'
          git diff --name-only | grep -qx 'src/ironvale/content.js'
          test "$(git diff --name-only | wc -l)" -eq 2
      - name: Commit verified starter island
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/rift-world-blocks/brackenford-lowlands-001.json src/ironvale/content.js
          git commit -m 'Expand Valeborn starter zone into organic island'
          git push origin HEAD:main
