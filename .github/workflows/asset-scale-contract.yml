name: Asset Scale Contract
on:
  push:
    branches: [asset-scale-contract]
permissions:
  contents: write
jobs:
  scale-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: asset-scale-contract
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Patch meter and asset scale contract
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json

          scale_runtime = r'''export const RIFT_SCALE_FORMAT = 'rift-scale-v1';
          export const RIFT_ASSET_SCALE_FORMAT = 'rift-asset-scale-v1';
          export const RIFT_WORLD_UNITS = 'meters';
          export const RIFT_METERS_PER_WORLD_UNIT = 1;
          export const RIFT_REFERENCE_CHARACTER_HEIGHT_METERS = 1.82;
          export const RIFT_REFERENCE_COLLIDER_HEIGHT_METERS = 1.8;
          export const RIFT_GLTF_DEFAULT_UNITS = 'meters';

          const UNIT_TO_METERS = Object.freeze({
            meters: 1,
            centimeters: 0.01,
            millimeters: 0.001,
            feet: 0.3048,
            inches: 0.0254
          });

          function finitePositive(value, fallback = 1) {
            const number = Number(value);
            return Number.isFinite(number) && number > 0 ? number : fallback;
          }

          function scaleVector(value, fallback = [1, 1, 1]) {
            const source = Array.isArray(value) && value.length >= 3 ? value : fallback;
            const result = source.slice(0, 3).map(Number);
            if (!result.every(item => Number.isFinite(item) && item > 0)) throw new Error('Asset placement scale must contain three positive finite values.');
            return result;
          }

          export function validateWorldScaleContract(world) {
            const errors = [];
            const contract = world?.scale;
            const assetPolicy = contract?.assetPolicy;
            if (world?.units !== RIFT_WORLD_UNITS) errors.push(`world.units must be ${RIFT_WORLD_UNITS}`);
            if (contract?.format !== RIFT_SCALE_FORMAT) errors.push(`scale.format must be ${RIFT_SCALE_FORMAT}`);
            if (contract?.worldUnits !== RIFT_WORLD_UNITS) errors.push(`scale.worldUnits must be ${RIFT_WORLD_UNITS}`);
            if (Number(contract?.metersPerWorldUnit) !== RIFT_METERS_PER_WORLD_UNIT) errors.push('scale.metersPerWorldUnit must be 1');
            if (Math.abs(Number(contract?.referenceCharacterHeightMeters) - RIFT_REFERENCE_CHARACTER_HEIGHT_METERS) > 1e-6) errors.push('reference character height must be 1.82m');
            if (Math.abs(Number(contract?.referenceColliderHeightMeters) - RIFT_REFERENCE_COLLIDER_HEIGHT_METERS) > 1e-6) errors.push('reference collider height must be 1.8m');
            if (assetPolicy?.format !== RIFT_ASSET_SCALE_FORMAT) errors.push(`assetPolicy.format must be ${RIFT_ASSET_SCALE_FORMAT}`);
            if (assetPolicy?.gltfDefaultUnits !== RIFT_GLTF_DEFAULT_UNITS) errors.push('glTF assets must default to meter units');
            if (assetPolicy?.preserveAuthoredScale !== true) errors.push('generic assets must preserve authored scale');
            if (assetPolicy?.autoGuessScale !== false) errors.push('asset scale auto-guessing must remain disabled');
            if (assetPolicy?.allowMetadataUnitConversion !== true) errors.push('asset metadata unit conversion must be enabled');
            if (assetPolicy?.allowMetadataCorrectionScale !== true) errors.push('asset metadata correction scale must be enabled');
            try { scaleVector(assetPolicy?.placementScaleDefault); } catch (error) { errors.push(error.message); }
            return { ok: errors.length === 0, errors, contract };
          }

          export function resolveAssetScale(metadata = {}, placementScale = [1, 1, 1]) {
            const sourceUnits = String(metadata.units || metadata.sourceUnits || RIFT_GLTF_DEFAULT_UNITS).toLowerCase();
            const metersPerSourceUnit = UNIT_TO_METERS[sourceUnits];
            if (!metersPerSourceUnit) throw new Error(`Unsupported asset source units: ${sourceUnits}. Add explicit scale metadata instead of guessing.`);
            const correctionScale = finitePositive(metadata.scaleCorrection ?? metadata.correctionScale, 1);
            const authoredToWorldScale = metersPerSourceUnit / RIFT_METERS_PER_WORLD_UNIT * correctionScale;
            const placement = scaleVector(placementScale);
            return {
              format: RIFT_ASSET_SCALE_FORMAT,
              sourceUnits,
              metersPerSourceUnit,
              correctionScale,
              authoredToWorldScale,
              placementScale: placement,
              finalScale: placement.map(value => value * authoredToWorldScale)
            };
          }

          export function assetBoundsToWorldMeters(bounds, scaleInfo) {
            if (!bounds?.min || !bounds?.max) return null;
            const finalScale = scaleVector(scaleInfo?.finalScale || [1, 1, 1]);
            const min = bounds.min.slice(0, 3).map(Number);
            const max = bounds.max.slice(0, 3).map(Number);
            if (![...min, ...max].every(Number.isFinite)) return null;
            const size = max.map((value, index) => Math.abs(value - min[index]) * finalScale[index]);
            return { min, max, sizeMeters: size };
          }
          '''
          Path('public/rift-scale.js').write_text(scale_runtime, encoding='utf-8')

          app_path = Path('public/app.js')
          app = app_path.read_text(encoding='utf-8')
          app = app.replace(
            "import { createRiftTerrainMaterialRuntime } from './rift-terrain-materials.js?v=20260901-terrain-lock-r1';\nimport { loadRiggedCharacterAsset } from './rift-character.js?v=20260831-character-sparse-r1';",
            "import { createRiftTerrainMaterialRuntime } from './rift-terrain-materials.js?v=20260901-terrain-lock-r1';\nimport { validateWorldScaleContract } from './rift-scale.js?v=20260901-scale-contract-r1';\nimport { loadRiggedCharacterAsset } from './rift-character.js?v=20260901-scale-contract-r1';"
          )
          anchor = "  worldDocument = await response.json();\n  terrain = new RiftLandscape(worldDocument.terrain);"
          replacement = "  worldDocument = await response.json();\n  const worldScaleValidation = validateWorldScaleContract(worldDocument);\n  if (!worldScaleValidation.ok) throw new Error(`World scale validation failed: ${worldScaleValidation.errors.join('; ')}`);\n  terrain = new RiftLandscape(worldDocument.terrain);"
          if anchor not in app:
            raise SystemExit('app world boot scale anchor missing')
          app = app.replace(anchor, replacement, 1)
          app_path.write_text(app, encoding='utf-8')

          character_path = Path('public/rift-character.js')
          character = character_path.read_text(encoding='utf-8')
          if not character.startswith('const GLB_MAGIC'):
            raise SystemExit('character header changed')
          character = "import { RIFT_REFERENCE_CHARACTER_HEIGHT_METERS } from './rift-scale.js?v=20260901-scale-contract-r1';\n\n" + character
          if 'const TARGET_HEIGHT = 1.82;' not in character:
            raise SystemExit('character target height anchor missing')
          character = character.replace('const TARGET_HEIGHT = 1.82;', 'const TARGET_HEIGHT = RIFT_REFERENCE_CHARACTER_HEIGHT_METERS;', 1)
          character_path.write_text(character, encoding='utf-8')

          world_path = Path('public/world/ironvale-terrain.json')
          world = json.loads(world_path.read_text(encoding='utf-8'))
          world['units'] = 'meters'
          world['scale'] = {
            'format': 'rift-scale-v1',
            'worldUnits': 'meters',
            'metersPerWorldUnit': 1,
            'referenceCharacterHeightMeters': 1.82,
            'referenceColliderHeightMeters': 1.8,
            'assetPolicy': {
              'format': 'rift-asset-scale-v1',
              'gltfDefaultUnits': 'meters',
              'preserveAuthoredScale': True,
              'autoGuessScale': False,
              'allowMetadataUnitConversion': True,
              'allowMetadataCorrectionScale': True,
              'defaultCorrectionScale': 1,
              'placementScaleDefault': [1, 1, 1],
              'allowNonUniformPlacementScale': True,
              'characterPolicy': 'normalize-to-reference-height'
            }
          }
          world.setdefault('metadata', {})['assetScaleContract'] = True
          world['metadata']['assetScaleSchemaVersion'] = 1
          world_path.write_text(json.dumps(world, indent=2) + '\n', encoding='utf-8')

          package_path = Path('package.json')
          package = package_path.read_text(encoding='utf-8')
          old = 'node --check public/rift-terrain-materials.js && node scripts/check-native.mjs'
          new = 'node --check public/rift-terrain-materials.js && node --check public/rift-scale.js && node scripts/check-native.mjs'
          if old not in package:
            raise SystemExit('package build anchor missing')
          package = package.replace(old, new, 1)
          package_path.write_text(package, encoding='utf-8')

          check_path = Path('scripts/check-core.js')
          check = check_path.read_text(encoding='utf-8')
          check = check.replace(
            "import fs from 'node:fs';",
            "import fs from 'node:fs';\nimport { validateWorldScaleContract, resolveAssetScale, RIFT_REFERENCE_CHARACTER_HEIGHT_METERS } from '../public/rift-scale.js';",
            1
          )
          world_anchor = "if (world.format !== 'rift-world-v1') failures.push('world format');"
          world_checks = """if (world.format !== 'rift-world-v1') failures.push('world format');
          const worldScaleValidation = validateWorldScaleContract(world);
          if (!worldScaleValidation.ok) failures.push(`world scale contract: ${worldScaleValidation.errors.join('; ')}`);
          if (world.metadata?.assetScaleContract !== true || world.metadata?.assetScaleSchemaVersion !== 1) failures.push('asset scale metadata');
          if (RIFT_REFERENCE_CHARACTER_HEIGHT_METERS !== 1.82) failures.push('reference character scale');
          const meterAssetScale = resolveAssetScale({ units: 'meters' });
          if (meterAssetScale.authoredToWorldScale !== 1 || JSON.stringify(meterAssetScale.finalScale) !== JSON.stringify([1,1,1])) failures.push('meter-authored asset scale preservation');
          const centimeterAssetScale = resolveAssetScale({ units: 'centimeters' });
          if (Math.abs(centimeterAssetScale.authoredToWorldScale - 0.01) > 1e-9) failures.push('explicit centimeter asset conversion');
          let rejectedUnknownAssetUnits = false;
          try { resolveAssetScale({ units: 'mystery-units' }); } catch { rejectedUnknownAssetUnits = true; }
          if (!rejectedUnknownAssetUnits) failures.push('unknown asset units must not be guessed');"""
          if world_anchor not in check:
            raise SystemExit('check-core world anchor missing')
          check = check.replace(world_anchor, world_checks, 1)
          app_anchor = "if (!app.includes(\"import { RiftLandscape } from './rift-landscape.js?v=\") || !app.includes('new RiftLandscape(worldDocument.terrain)')) failures.push('RiftLandscape runtime integration');"
          app_checks = app_anchor + "\nif (!app.includes(\"import { validateWorldScaleContract } from './rift-scale.js?v=\") || !app.includes('validateWorldScaleContract(worldDocument)')) failures.push('world scale runtime validation');"
          if app_anchor not in check:
            raise SystemExit('check-core app anchor missing')
          check = check.replace(app_anchor, app_checks, 1)
          character_anchor = "if (!characterRuntime.includes('loadRiggedCharacterAsset(') || !characterRuntime.includes('buildAnimationClips(') || !characterRuntime.includes('baseColorImage') || !characterRuntime.includes('getSkinMatrices(')) failures.push('character texture/animation runtime');"
          character_checks = character_anchor + "\nif (!characterRuntime.includes('RIFT_REFERENCE_CHARACTER_HEIGHT_METERS') || characterRuntime.includes('const TARGET_HEIGHT = 1.82;')) failures.push('character/world scale source of truth');\nconst scaleRuntime = fs.readFileSync('public/rift-scale.js', 'utf8');\nif (!scaleRuntime.includes(\"RIFT_ASSET_SCALE_FORMAT = 'rift-asset-scale-v1'\") || !scaleRuntime.includes('resolveAssetScale(') || !scaleRuntime.includes('auto-guessing')) failures.push('asset scale normalization runtime');"
          if character_anchor not in check:
            raise SystemExit('check-core character anchor missing')
          check = check.replace(character_anchor, character_checks, 1)
          check_path.write_text(check, encoding='utf-8')

          index_path = Path('public/index.html')
          index = index_path.read_text(encoding='utf-8')
          old_tag = '/app.js?v=20260901-terrain-lock-r3'
          new_tag = '/app.js?v=20260901-scale-contract-r1'
          if old_tag not in index:
            raise SystemExit('index app cache anchor missing')
          index_path.write_text(index.replace(old_tag, new_tag, 1), encoding='utf-8')
          PY
      - name: Verify scale contract and full build
        run: npm run build
      - name: Commit verified scale contract
        shell: bash
        run: |
          rm .github/workflows/asset-scale-contract.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Lock world and asset meter scale contract"
          git push origin HEAD:asset-scale-contract
