name: Ironvale One-shot Realtime 10Hz

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-realtime-10hz.yml'
      - 'scripts/apply-realtime-10hz-upgrade.mjs'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply realtime 10Hz upgrade
        run: node scripts/apply-realtime-10hz-upgrade.mjs
      - name: Verify syntax
        run: |
          node --check public/app.js
          node --check public/rift-realtime.js
          node --check public/rift-auto-validation.js
          node --check public/rift-architecture-guard.js
          node --check src/realtime-entry.js
      - name: Commit source upgrade
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/app.js public/rift-auto-validation.js public/rift-architecture-guard.js public/index.html src/realtime-entry.js
          if git diff --cached --quiet; then
            echo "No source upgrade required."
            exit 0
          fi
          git commit -m "Upgrade Ironvale movement to direct 10Hz authority"
          git push origin HEAD:main
