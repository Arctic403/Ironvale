name: Apply Terrain Profiler

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply-terrain-profiler.mjs'
      - 'scripts/fix-terrain-profiler-helper.mjs'
      - '.github/workflows/apply-terrain-profiler.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ironvale-terrain-profiler-patch
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply profiler patch
        run: |
          node scripts/fix-terrain-profiler-helper.mjs
          node --check scripts/apply-terrain-profiler.mjs
          node scripts/apply-terrain-profiler.mjs
          node - <<'NODE'
          const fs = require('fs');
          const path = 'scripts/check-realtime-state.mjs';
          let text = fs.readFileSync(path, 'utf8');
          const before = "requireMatch(html, /rift-validator-guard\\.js\\?v=20260901-sprint-speed-r2/, 'validator sprint-speed module loaded');";
          const after = "requireMatch(html, /rift-validator-guard\\.js\\?v=20260901-terrain-profiler-r1/, 'validator terrain-profiler module loaded');";
          if (!text.includes(before)) throw new Error('stale validator cache contract target missing');
          fs.writeFileSync(path, text.replace(before, after));
          NODE

      - name: Verify patched sources
        run: |
          node --check public/app.js
          node --check public/rift-terrain.js
          node --check public/rift-landscape.js
          node --check public/rift-validator-guard.js
          node scripts/check-terrain-edit-profiler.mjs
          npm run build

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public scripts/check-terrain-edit-profiler.mjs scripts/check-realtime-state.mjs
          git commit -m "Instrument terrain edit performance"
          git restore scripts/apply-terrain-profiler.mjs
          git pull --rebase origin main
          git push origin HEAD:main
