name: Rift Building Full Inspection

on:
  push:
    branches:
      - ai-static-world-builder
    paths:
      - 'public/rift-building-program.js'
      - 'public/rift-interior-architecture.js'
      - 'public/rift-building-inspection.js'
      - 'public/rift-building-inspection-core.js'
      - 'public/rift-building-3d-inspection.js'
      - 'public/building-inspection.html'
      - 'public/building-3d-inspection.html'
      - 'public/riftcity-buildings/**'
      - 'public/rift-engine.js'
      - 'public/rift-city-block-importer.js'
      - 'scripts/check-rift-building-programs.js'
      - 'scripts/check-rift-interior-architecture.js'
      - 'scripts/check-rift-inspection-pipeline.js'
      - 'scripts/report-rift-building-inspection.js'
      - 'scripts/package-rift-inspection-artifact.js'
      - 'package.json'
      - '.github/workflows/rift-building-interior-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rift-building-full-inspection-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout AI branch
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Ensure inspection image tools
        shell: bash
        run: |
          if command -v magick >/dev/null 2>&1 || { command -v convert >/dev/null 2>&1 && command -v montage >/dev/null 2>&1; }; then
            exit 0
          fi
          sudo apt-get update -qq
          sudo apt-get install -y imagemagick

      - name: Verify physical architecture and inspection slices
        run: |
          npm run verify:building-programs
          npm run verify:interiors
          npm run verify:inspection
          mkdir -p rift-building-previews/full-resolution rift-building-previews/previews
          node scripts/report-rift-building-inspection.js public/riftcity-buildings/riftcity-bank-001.json > rift-building-previews/bank-inspection-report.json

      - name: Start static RiftCity server
        run: |
          python3 -m http.server 4173 --directory public > /tmp/rift-building-static.log 2>&1 &
          echo $! > /tmp/rift-building-static.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/building-3d-inspection.html >/dev/null; then exit 0; fi
            sleep 0.25
          done
          cat /tmp/rift-building-static.log
          exit 1

      - name: Render one-level bank review set
        shell: bash
        run: |
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME" ]; then echo 'No Chrome/Chromium binary found.' >&2; exit 1; fi
          FLAGS=(--headless=new --no-sandbox --disable-dev-shm-usage --hide-scrollbars --ignore-gpu-blocklist --enable-webgl --use-angle=swiftshader --window-size=1800,1200 --virtual-time-budget=2500)
          BASE='http://127.0.0.1:4173/building-3d-inspection.html?program=./riftcity-buildings/riftcity-bank-001.json'
          PLAN='http://127.0.0.1:4173/building-inspection.html?program=./riftcity-buildings/riftcity-bank-001.json'
          PIDS=()

          flush_shots() {
            local pid
            for pid in "${PIDS[@]}"; do wait "$pid"; done
            PIDS=()
          }

          shot() {
            local name="$1" url="$2"
            (
              local profile
              profile="$(mktemp -d)"
              trap 'rm -rf "$profile"' EXIT
              "$CHROME" "${FLAGS[@]}" --user-data-dir="$profile" --screenshot="rift-building-previews/full-resolution/$name.png" "$url"
              test -s "rift-building-previews/full-resolution/$name.png"
            ) &
            PIDS+=("$!")
            if [ "${#PIDS[@]}" -ge 3 ]; then flush_shots; fi
          }

          shot bank-exterior-top "$BASE&mode=full&view=top"
          shot bank-exterior-iso-nw "$BASE&mode=full&view=iso-nw"
          shot bank-exterior-iso-ne "$BASE&mode=full&view=iso-ne"
          shot bank-exterior-iso-sw "$BASE&mode=full&view=iso-sw"
          shot bank-exterior-iso-se "$BASE&mode=full&view=iso-se"
          shot bank-exterior-north "$BASE&mode=full&view=north"
          shot bank-exterior-east "$BASE&mode=full&view=east"
          shot bank-exterior-south "$BASE&mode=full&view=south"
          shot bank-exterior-west "$BASE&mode=full&view=west"

          for view in iso-nw iso-ne iso-sw iso-se; do
            shot "bank-f1-$view" "$BASE&mode=floor&floor=1&view=$view"
          done

          for direction in north east south west; do
            shot "bank-vault-eye-$direction" "$BASE&mode=full&space=main-vault&view=inside-$direction"
            shot "bank-grand-hall-eye-$direction" "$BASE&mode=full&space=grand-hall&view=inside-$direction"
          done

          shot bank-teller-eye-north "$BASE&mode=full&space=teller-gallery&view=inside-north"
          shot bank-teller-eye-south "$BASE&mode=full&space=teller-gallery&view=inside-south"
          shot bank-executive-eye-west "$BASE&mode=full&space=east-executive-offices&view=inside-west"
          shot bank-security-eye-west "$BASE&mode=full&space=east-security&view=inside-west"

          shot bank-section-north "$BASE&mode=section&sectionAxis=z&sectionDepth=3&view=south"
          shot bank-section-south "$BASE&mode=section&sectionAxis=z&sectionDepth=3&view=north"
          shot bank-section-west "$BASE&mode=section&sectionAxis=x&sectionDepth=3&view=east"
          shot bank-section-east "$BASE&mode=section&sectionAxis=x&sectionDepth=3&view=west"
          shot bank-vault-section-ns "$BASE&mode=section&sectionAxis=z&sectionDepth=3&focus=main-vault&view=south"
          shot bank-vault-section-ew "$BASE&mode=section&sectionAxis=x&sectionDepth=3&focus=main-vault&view=east"
          shot bank-teller-section-ns "$BASE&mode=section&sectionAxis=z&sectionDepth=3&focus=teller-gallery&view=south"

          shot bank-f1-plan "$PLAN&floor=1"
          shot bank-xray-plan "$PLAN&floor=1&xray=1"
          flush_shots

      - name: Package AI review artifact
        run: node scripts/package-rift-inspection-artifact.js rift-building-previews

      - name: Upload fast AI review bundle
        uses: actions/upload-artifact@v4
        with:
          name: rift-building-ai-review
          path: |
            rift-building-previews/manifest.json
            rift-building-previews/bank-inspection-report.json
            rift-building-previews/contact-sheet.webp
            rift-building-previews/previews/*.webp
          if-no-files-found: error
          compression-level: 6
          retention-days: 14

      - name: Upload optional full-resolution PNG bundle
        uses: actions/upload-artifact@v4
        with:
          name: rift-building-full-resolution
          path: rift-building-previews/full-resolution/*.png
          if-no-files-found: error
          compression-level: 6
          retention-days: 14
